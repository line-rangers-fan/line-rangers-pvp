name: deploy-github-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-github-pages.yml"

permissions:
  contents: read

concurrency:
  group: line-rangers-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      data_sha256: ${{ steps.snapshot.outputs.data_sha256 }}
    steps:
      - name: Check out current site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued Pages run must deploy the newest canonical comparison
          # snapshot, never the older push SHA that originally queued it.
          ref: main

      - name: Validate public static entry
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/assets/community-entry.js
          test -s docs/assets/community-entry.css
          grep -q 'id="community-board-entry-slot"' docs/index.html
          grep -q 'community-entry.js?v=20260918-viewer-1' docs/index.html
          grep -q 'community-entry.css?v=20260918-stats-1' docs/index.html
          grep -q 'defaultState: true' docs/assets/community-entry.js
          grep -q 'state: true' docs/assets/community-entry.js
          grep -q 'allowedPath: "/boards"' docs/assets/community-entry.js
          grep -q 'api/activity?public=1' docs/assets/community-entry.js
          grep -q 'レジェンド帯 キャラ集計' docs/index.html
          jq -e '.target_players == 200 and .sampled_players == 200 and .complete_target == true' docs/data/character_usage.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs/data/character_usage.json").read_text(encoding="utf-8"))
          periods = ("hour", "day", "week", "month")
          comparison = data.get("comparison") or {}
          if comparison.get("reference_mode") != "jst_calendar_close_v1":
              raise SystemExit("Unexpected comparison reference mode")
          for period in periods:
              summary = (comparison.get("periods") or {}).get(period) or {}
              if summary.get("comparable") is not True or not summary.get("updated_at"):
                  raise SystemExit(f"Top-level comparison is not ready: {period}")

          for character in data.get("characters") or []:
              code = character.get("unit_code", "?")
              char_periods = ((character.get("change") or {}).get("periods") or {})
              for period in periods:
                  value = char_periods.get(period) or {}
                  delta = value.get("occurrence_count")
                  if value.get("comparable") is not True or not isinstance(delta, int) or isinstance(delta, bool):
                      raise SystemExit(f"Character comparison is not ready: {code} {period}")
              for equipment_type, category in (character.get("equipment_rankings") or {}).items():
                  for item in (category or {}).get("items") or []:
                      item_code = item.get("item_code", "?")
                      item_periods = ((item.get("change") or {}).get("periods") or {})
                      for period in periods:
                          value = item_periods.get(period) or {}
                          delta = value.get("occurrence_count")
                          if value.get("comparable") is not True or not isinstance(delta, int) or isinstance(delta, bool):
                              raise SystemExit(
                                  f"Equipment comparison is not ready: {code} {equipment_type} {item_code} {period}"
                              )
          print("All public comparison periods are populated.")
          PY
          if rg -n 'BOARD_OWNER_ACCESS_TOKEN|BOARD_OWNER_SUBJECT|BOARD_ANON_COOKIE_SECRET|CLOUDFLARE_.*TOKEN' docs; then
            echo "A secret-like value was found in the Pages artifact source."
            exit 1
          fi

      - name: Prepare cache-busted Pages artifact
        run: |
          set -euo pipefail
          rm -rf pages-dist
          cp -a docs pages-dist
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pages-dist/index.html")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["GITHUB_SHA"]
          assets = ("app.js", "community-entry.js", "style.css", "community-entry.css")
          for asset in assets:
              pattern = rf'(\./assets/{re.escape(asset)})\?v=[^"\']+'
              text, count = re.subn(pattern, rf'\1?v={sha}', text)
              if count != 1:
                  raise SystemExit(f"Expected exactly one cache-busted reference for {asset}, got {count}")
          path.write_text(text, encoding="utf-8")
          PY
          grep -q "app.js?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "community-entry.js?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "style.css?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "community-entry.css?v=$GITHUB_SHA" pages-dist/index.html

      - name: Record deployed comparison snapshot
        id: snapshot
        run: |
          set -euo pipefail
          hash="$(sha256sum pages-dist/data/character_usage.json | awk '{print $1}')"
          if ! [[ "$hash" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid comparison data SHA-256."
            exit 1
          fi
          echo "data_sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify deployed Pages serves current comparison data
        env:
          SITE_URL: https://line-rangers-fan.github.io/line-rangers-pvp
          EXPECTED_DATA_SHA256: ${{ needs.build.outputs.data_sha256 }}
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 18); do
            nonce="$GITHUB_SHA-$attempt"
            if curl -fsSL --retry 2 --retry-delay 1 "$SITE_URL/?deploy=$nonce" -o /tmp/index.html \
              && curl -fsSL --retry 2 --retry-delay 1 "$SITE_URL/data/character_usage.json?deploy=$nonce" -o /tmp/data.json \
              && grep -q 'data-language="ja"' /tmp/index.html \
              && grep -q 'data-language="en"' /tmp/index.html \
              && ! grep -q 'data-language="zh"' /tmp/index.html \
              && [ "$(sha256sum /tmp/data.json | awk '{print $1}')" = "$EXPECTED_DATA_SHA256" ] \
              && jq -e '
                .target_players == 200
                and .sampled_players == 200
                and .complete_target == true
                and .comparison.reference_mode == "jst_calendar_close_v1"
                and ([.comparison.periods.hour, .comparison.periods.day, .comparison.periods.week, .comparison.periods.month]
                  | all(.comparable == true and (.updated_at | type == "string" and length > 0)))
                and ([.characters[] |
                  [.change.periods.hour, .change.periods.day, .change.periods.week, .change.periods.month]
                  | all(.comparable == true and (.occurrence_count | type == "number"))]
                  | all(. == true))
                and ([.characters[] | .equipment_rankings[]?.items[]? |
                  [.change.periods.hour, .change.periods.day, .change.periods.week, .change.periods.month]
                  | all(.comparable == true and (.occurrence_count | type == "number"))]
                  | all(. == true))
              ' /tmp/data.json >/dev/null; then
              success=true
              break
            fi
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "Published Pages did not converge to the validated comparison build."
            exit 1
          fi
          echo "Published Pages comparison data is current and complete."

  audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production browser comparison audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-visual-audit.yml/dispatches" \
            -f ref=main >/dev/null
          echo "Dispatched production visual audit after verified Pages publication."

