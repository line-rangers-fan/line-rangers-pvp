name: deploy-original-community-production

# Production promotion stays manual or uses the one-shot promotion marker.
# The workflow is pinned to the currently validated copy commit and refuses
# to create missing production D1/R2 resources. Original PvP is overlaid from
# this repository immediately before build so community promotion cannot alter it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .production-promotion-trigger

permissions:
  contents: read

concurrency:
  group: line-rangers-original-community-production
  cancel-in-progress: false

env:
  COPY_SOURCE_SHA: f27b4aa31b6a8316bfb0b588a8ba4086290182ab
  WORKER_NAME: line-rangers-pvp-community-production
  D1_NAME: line-rangers-pvp-production-db
  R2_BUCKET: line-rangers-pvp-production-media
  PRODUCTION_BASE_URL: https://line-rangers-pvp-community-production.n-yu1791.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out original repository
        uses: actions/checkout@v4

      - name: Fetch exact validated copy source
        env:
          COPY_SOURCE_SHA: ${{ env.COPY_SOURCE_SHA }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --no-tags https://github.com/nyu1791-collab/copy-LINE-.git copy-source
          git -C copy-source fetch --depth=1 origin "$COPY_SOURCE_SHA"
          git -C copy-source checkout --detach "$COPY_SOURCE_SHA"
          test "$(git -C copy-source rev-parse HEAD)" = "$COPY_SOURCE_SHA"

      - name: Preserve original PvP exactly
        run: |
          set -euo pipefail
          rm -rf copy-source/public/pvp
          mkdir -p copy-source/public/pvp
          rsync -a --delete --exclude 'OWNER_PREVIEW_NOTE.md' docs/ copy-source/public/pvp/
          cmp docs/index.html copy-source/public/pvp/index.html
          diff -qr docs/assets copy-source/public/pvp/assets
          diff -qr docs/data copy-source/public/pvp/data
          echo "Original PvP HTML, assets, and data preserved unchanged."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: copy-source/package-lock.json

      - name: Install dependencies
        working-directory: copy-source
        run: npm run install:ci

      - name: Resolve Cloudflare account safely
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_BOARD_API_TOKEN is required."
            exit 78
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          if ! [[ "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Verify existing production D1 and R2 only
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          db_list="$(npx wrangler d1 list --json)"
          db_id="$(printf '%s' "$db_list" | jq -r --arg name "$D1_NAME" '[.[] | select(.name == $name) | (.uuid // .database_id // .id)][0] // empty')"
          if [ -z "$db_id" ]; then
            echo "Production D1 $D1_NAME does not exist. Refusing to create a new resource automatically."
            exit 78
          fi
          if ! [[ "$db_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "Unable to resolve the production D1 database ID."
            exit 1
          fi
          echo "::add-mask::$db_id"
          if ! npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            echo "Production R2 bucket $R2_BUCKET does not exist. Refusing to create a new resource automatically."
            exit 78
          fi
          tmp="$(mktemp)"
          jq --arg id "$db_id" --arg db "$D1_NAME" --arg bucket "$R2_BUCKET" --arg worker "$WORKER_NAME" '
            .name = $worker
            | (.d1_databases[] | select(.binding == "DB") | .database_name) = $db
            | (.d1_databases[] | select(.binding == "DB") | .database_id) = $id
            | (.r2_buckets[] | select(.binding == "BUCKET") | .bucket_name) = $bucket
          ' wrangler.jsonc > "$tmp"
          mv "$tmp" wrangler.jsonc
          grep -q "$db_id" wrangler.jsonc
          grep -q "$R2_BUCKET" wrangler.jsonc

      - name: Preflight Owner authorization source
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
          BOARD_OWNER_ACCESS_TOKEN: ${{ secrets.BOARD_OWNER_ACCESS_TOKEN }}
          BOARD_OWNER_SUBJECT: ${{ secrets.BOARD_OWNER_SUBJECT }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_OWNER_ACCESS_TOKEN:-}" ] && [ -n "${BOARD_OWNER_SUBJECT:-}" ]; then
            echo "Owner secrets are available from the original repository secret store."
            exit 0
          fi
          current="$(npx wrangler secret list --name "$WORKER_NAME" --format json 2>/dev/null || printf '[]')"
          printf '%s' "$current" | jq -e '.[] | select(.name == "BOARD_OWNER_ACCESS_TOKEN")' >/dev/null || { echo "Production Owner access secret is missing."; exit 78; }
          printf '%s' "$current" | jq -e '.[] | select(.name == "BOARD_OWNER_SUBJECT")' >/dev/null || { echo "Production Owner subject secret is missing."; exit 78; }
          echo "Existing production Owner secret names verified."

      - name: Audit dependencies and run complete regression suite
        working-directory: copy-source
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint

      - name: Apply production D1 migrations
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy validated copy to production Worker
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          output_config="$(find dist -type f -name wrangler.json -print -quit)"
          if [ -z "$output_config" ]; then
            echo "Cloudflare Vite output config was not generated."
            find dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          npx wrangler deploy --config "$output_config"

      - name: Preserve anonymous secret and synchronize Owner secrets when provided
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
          BOARD_OWNER_ACCESS_TOKEN: ${{ secrets.BOARD_OWNER_ACCESS_TOKEN }}
          BOARD_OWNER_SUBJECT: ${{ secrets.BOARD_OWNER_SUBJECT }}
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
          if ! printf '%s' "$secrets_json" | jq -e '.[] | select(.name == "BOARD_ANON_COOKIE_SECRET")' >/dev/null; then
            openssl rand -hex 48 | npx wrangler secret put BOARD_ANON_COOKIE_SECRET --name "$WORKER_NAME"
          fi
          if [ -n "${BOARD_OWNER_ACCESS_TOKEN:-}" ] && [ -n "${BOARD_OWNER_SUBJECT:-}" ]; then
            printf '%s' "$BOARD_OWNER_ACCESS_TOKEN" | npx wrangler secret put BOARD_OWNER_ACCESS_TOKEN --name "$WORKER_NAME"
            printf '%s' "$BOARD_OWNER_SUBJECT" | npx wrangler secret put BOARD_OWNER_SUBJECT --name "$WORKER_NAME"
          fi
          final="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
          for required in BOARD_ANON_COOKIE_SECRET BOARD_OWNER_ACCESS_TOKEN BOARD_OWNER_SUBJECT; do
            printf '%s' "$final" | jq -e --arg required "$required" '.[] | select(.name == $required)' >/dev/null || { echo "Required production secret name missing: $required"; exit 78; }
          done

      - name: Verify production Worker end to end
        working-directory: copy-source
        run: |
          set -euo pipefail
          pvp="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 "$PRODUCTION_BASE_URL/pvp/index.html")"
          board="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 "$PRODUCTION_BASE_URL/boards")"
          snapshot="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 "$PRODUCTION_BASE_URL/pvp/data/character_usage.json")"
          health="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 "$PRODUCTION_BASE_URL/api/health")"
          api_headers="$(mktemp)"
          api="$(curl --location --fail --silent --show-error --dump-header "$api_headers" --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 "$PRODUCTION_BASE_URL/api/board")"
          grep -q 'レジェンド帯 キャラ集計' <<< "$pvp"
          grep -q '新キャラ情報掲示板' <<< "$board"
          printf '%s' "$snapshot" | jq -e '.target_players == 200 and .sampled_players == 200 and .complete_target == true' >/dev/null
          printf '%s' "$health" | jq -e '.ok == true and .checks.d1 == true and .checks.r2 == true' >/dev/null
          printf '%s' "$api" | jq -e '(.boards | type == "array") and (.posts | type == "array")' >/dev/null
          grep -qi '^x-content-type-options: nosniff' "$api_headers"
          echo "Production Worker verified: $PRODUCTION_BASE_URL"
