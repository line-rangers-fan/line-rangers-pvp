# File: .github/workflows/update-character-usage.yml
name: Update Character Usage

on:
  schedule:
    # 毎日午前0時（日本時間）に実行
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      debug:
        description: "調査モード。公開データを更新せず、調査ファイルだけを保存する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-character-usage
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium system dependencies
        run: playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run scraper
        env:
          DEBUG: ${{ env.DEBUG_MODE }}
          TARGET_PLAYER_COUNT: "200"
          MIN_REQUIRED_PLAYERS: "50"
          MIN_CHARACTERS_PER_PLAYER: "5"
          MAX_CHARACTERS_PER_PLAYER: "15"
        run: python scripts/scrape_character_usage.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: .artifacts/debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated data
        if: env.DEBUG_MODE != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/character_usage.json

          if git diff --staged --quiet; then
            echo "集計データに変更はありません。"
          else
            git commit -m "Update legend character usage [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD
          fi

      - name: Configure GitHub Pages
        if: env.DEBUG_MODE != '1'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: env.DEBUG_MODE != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: env.DEBUG_MODE != '1'
        id: deployment
        uses: actions/deploy-pages@v4
