name: verify-ranger-detail-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ranger-detail-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UNIT_CODE: u1556e-af
    steps:
      - name: Inspect target Ranger skill mapping
        run: |
          set -euo pipefail
          basics="$(mktemp)"
          skills="$(mktemp)"
          translations="$(mktemp)"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 45             https://rangers.lerico.net/api/getRangersBasics -o "$basics"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 45             https://rangers.lerico.net/api/getSkills -o "$skills"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 45             'https://rangers.lerico.net/api/v2/translate?keys=ja%3AUNIT%2Cja%3ASKILL' -o "$translations"

          row="$(jq -c --arg unit "$UNIT_CODE" '.[] | select(.unitCode==$unit)' "$basics")"
          test -n "$row"
          echo "TARGET_BASIC=$(jq -c '{unitCode,unitNameCode,skillCode,skillCode2,skillCode3,passiveSkillCode,iconSkillCode,iconSkillCode2,iconSkillCode3}' <<<"$row")"

          codes="$(jq -r '[.skillCode,.skillCode2,.skillCode3] | map(select(type=="string" and length>0)) | unique | .[]' <<<"$row")"
          while IFS= read -r code; do
            [ -n "$code" ] || continue
            skill="$(jq -c --arg code "$code" '.[] | select(.skillCode==$code) | {skillCode,nameCode,descriptionCode,skillType,iconResourcePath}' "$skills")"
            echo "TARGET_SKILL=$skill"
            name_code="$(jq -r '.nameCode // empty' <<<"$skill")"
            desc_code="$(jq -r '.descriptionCode // empty' <<<"$skill")"
            echo "TARGET_SKILL_NAME=$(jq -r --arg code "$name_code" '."ja:SKILL"[$code] // ""' "$translations")"
            echo "TARGET_SKILL_DESC=$(jq -r --arg code "$desc_code" '."ja:SKILL"[$code] // ""' "$translations" | tr '\n' ' ')"
          done <<<"$codes"
          echo "TARGET_UNIT_NAME=$(jq -r --arg code "$UNIT_CODE" '."ja:UNIT"[$code+"_nm"] // ""' "$translations")"
