name: sync-production-pvp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".production-promotion-trigger"
      - ".github/workflows/sync-production-pvp.yml"

permissions:
  contents: read

# Serialize with full community promotions so a PvP-only refresh can never race
# a board deployment or overwrite a newer validated community build.
concurrency:
  group: line-rangers-original-community-production
  cancel-in-progress: false

env:
  MINIMUM_COMMUNITY_SOURCE_SHA: d7b4fe844766a77d3526379f74e6bce8becc425c
  WORKER_NAME: line-rangers-pvp-community-production
  D1_NAME: line-rangers-pvp-production-db
  R2_BUCKET: line-rangers-pvp-production-media
  PRODUCTION_BASE_URL: https://line-rangers-pvp-community-production.n-yu1791.workers.dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out current PvP source with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sync runs share a serialized production queue. Always inspect the
          # newest canonical state when this run starts, while retaining history
          # so an incomplete collection can fall back to the newest verified
          # 200/200 production snapshot without publishing partial data.
          ref: main
          fetch-depth: 0

      - name: Resolve currently promoted community source
        run: |
          set -euo pipefail
          source_sha="$(sed -n 's/^copy_source_sha=//p' .production-promotion-trigger | head -n1)"
          if ! [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Production promotion marker does not contain a valid copy source SHA."
            exit 78
          fi
          echo "COPY_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Fetch exact promoted community source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --no-tags https://github.com/nyu1791-collab/copy-LINE-.git copy-source
          git -C copy-source fetch --depth=256 origin "$COPY_SOURCE_SHA" "$MINIMUM_COMMUNITY_SOURCE_SHA"
          git -C copy-source checkout --detach "$COPY_SOURCE_SHA"
          test "$(git -C copy-source rev-parse HEAD)" = "$COPY_SOURCE_SHA"
          if ! git -C copy-source merge-base --is-ancestor "$MINIMUM_COMMUNITY_SOURCE_SHA" "$COPY_SOURCE_SHA"; then
            echo "Promoted community source predates the minimum validated unread/Owner identity fix."
            exit 78
          fi

      - name: Select newest verified full PvP snapshot for production
        run: |
          set -euo pipefail
          is_full_snapshot() {
            local sha="$1"
            local tmp
            tmp="$(mktemp -d)"
            if ! git show "$sha:docs/data/character_usage.json" > "$tmp/data.json" 2>/dev/null \
              || ! git show "$sha:docs/data/character_usage_health.json" > "$tmp/health.json" 2>/dev/null; then
              rm -rf "$tmp"
              return 1
            fi
            python - "$tmp/data.json" "$tmp/health.json" <<'PY'
import json, sys
from pathlib import Path

data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
health = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
quality = health.get('collection_quality') or {}
ok = (
    data.get('target_players') == 200
    and data.get('sampled_players') == 200
    and data.get('complete_target') is True
    and data.get('publication_mode') == 'complete'
    and health.get('target_players') == 200
    and health.get('sampled_players') == 200
    and health.get('complete_target') is True
    and health.get('publication_mode') == 'complete'
    and health.get('validated_full_sample') is True
    and quality.get('invalid_player_records') == 0
    and quality.get('detail_fetch_failures') == 0
)
raise SystemExit(0 if ok else 1)
PY
            status=$?
            rm -rf "$tmp"
            return "$status"
          }

          selected=""
          head_sha="$(git rev-parse HEAD)"
          if is_full_snapshot "$head_sha"; then
            selected="$head_sha"
          else
            while IFS= read -r sha; do
              if [ "$sha" = "$head_sha" ]; then
                continue
              fi
              if is_full_snapshot "$sha"; then
                selected="$sha"
                break
              fi
            done < <(git log --format=%H -- docs/data/character_usage_health.json)
          fi
          if ! [[ "$selected" =~ ^[a-f0-9]{40}$ ]]; then
            echo "No verified complete 200/200 PvP snapshot exists in canonical history."
            exit 78
          fi
          echo "PRODUCTION_PVP_SOURCE_SHA=$selected" >> "$GITHUB_ENV"
          if [ "$selected" != "$head_sha" ]; then
            echo "::warning::Current canonical PvP is incomplete; production will retain verified full snapshot $selected."
          fi
          echo "Production PvP source: $selected" >> "$GITHUB_STEP_SUMMARY"

      - name: Overlay current UI with verified full production PvP data
        run: |
          set -euo pipefail
          rm -rf copy-source/public/pvp
          mkdir -p copy-source/public/pvp
          rsync -a --delete --exclude 'OWNER_PREVIEW_NOTE.md' docs/ copy-source/public/pvp/

          if [ "$PRODUCTION_PVP_SOURCE_SHA" != "$(git rev-parse HEAD)" ]; then
            frozen="$RUNNER_TEMP/verified-full-pvp"
            rm -rf "$frozen"
            mkdir -p "$frozen"
            git archive "$PRODUCTION_PVP_SOURCE_SHA" docs/data | tar -x -C "$frozen"
            rm -rf copy-source/public/pvp/data
            cp -a "$frozen/docs/data" copy-source/public/pvp/data
          fi

          cmp docs/index.html copy-source/public/pvp/index.html
          diff -qr docs/assets copy-source/public/pvp/assets
          jq -e '
            .target_players == 200 and
            .sampled_players == 200 and
            .complete_target == true and
            .publication_mode == "complete"
          ' copy-source/public/pvp/data/character_usage.json >/dev/null
          jq -e '
            .target_players == 200 and
            .sampled_players == 200 and
            .complete_target == true and
            .publication_mode == "complete" and
            .validated_full_sample == true and
            .collection_quality.invalid_player_records == 0 and
            .collection_quality.detail_fetch_failures == 0
          ' copy-source/public/pvp/data/character_usage_health.json >/dev/null

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: copy-source/package-lock.json

      - name: Install dependencies
        working-directory: copy-source
        run: npm run install:ci

      - name: Resolve existing Cloudflare bindings only
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_BOARD_API_TOKEN is required."
            exit 78
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          if ! [[ "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

          db_list="$(npx wrangler d1 list --json)"
          db_id="$(printf '%s' "$db_list" | jq -r --arg name "$D1_NAME" '[.[] | select(.name == $name) | (.uuid // .database_id // .id)][0] // empty')"
          if ! [[ "$db_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "Existing production D1 could not be resolved."
            exit 78
          fi
          if ! npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            echo "Existing production R2 bucket could not be resolved."
            exit 78
          fi
          echo "::add-mask::$db_id"
          tmp="$(mktemp)"
          jq --arg id "$db_id" --arg db "$D1_NAME" --arg bucket "$R2_BUCKET" --arg worker "$WORKER_NAME" '
            .name = $worker
            | (.d1_databases[] | select(.binding == "DB") | .database_name) = $db
            | (.d1_databases[] | select(.binding == "DB") | .database_id) = $id
            | (.r2_buckets[] | select(.binding == "BUCKET") | .bucket_name) = $bucket
          ' wrangler.jsonc > "$tmp"
          mv "$tmp" wrangler.jsonc

      - name: Validate current PvP snapshot
        run: |
          set -euo pipefail
          # Worker production is stricter than temporary Pages publication:
          # only a verified full 200/200 bundle can pass this gate.
          python scripts/validate_public_comparisons.py copy-source/public/pvp/data/character_usage.json
          validation_root="$RUNNER_TEMP/production-pvp-validation"
          rm -rf "$validation_root"
          mkdir -p "$validation_root/docs"
          ln -s "$GITHUB_WORKSPACE/copy-source/public/pvp/data" "$validation_root/docs/data"
          (cd "$validation_root" && python "$GITHUB_WORKSPACE/scripts/validate_public_bundle.py")
          jq -e '.sampled_players == 200 and .complete_target == true and .publication_mode == "complete"' \
            copy-source/public/pvp/data/character_usage.json >/dev/null
          jq -e '.sampled_players == 200 and .complete_target == true and .validated_full_sample == true and .collection_quality.invalid_player_records == 0' \
            copy-source/public/pvp/data/character_usage_health.json >/dev/null

      - name: Overlay audited monthly community registry without changing promoted code
        run: |
          set -euo pipefail
          if [ ! -f copy-source/scripts/audit-community-release.mjs ]; then
            echo '::notice::Community code promotion is pending; preserving the pinned board registry.'
            exit 0
          fi
          if ! timeout 45s git -C copy-source fetch --no-tags origin main:refs/remotes/origin/community-candidate; then
            echo '::warning::Community source could not be fetched; preserving pinned boards and continuing PvP sync.'
            exit 0
          fi
          candidate_sha="$(git -C copy-source rev-parse refs/remotes/origin/community-candidate)"
          if [ "$candidate_sha" = "$COPY_SOURCE_SHA" ]; then
            echo 'Community registry already matches the promoted source.'
            exit 0
          fi
          if ! git -C copy-source merge-base --is-ancestor "$COPY_SOURCE_SHA" "$candidate_sha"; then
            echo '::warning::Community main diverged from promoted code; keeping the pinned board registry.'
            exit 0
          fi
          if ! git -C copy-source worktree add --detach "$GITHUB_WORKSPACE/community-candidate" "$candidate_sha"; then
            echo '::warning::Community candidate checkout failed; preserving pinned boards and continuing PvP sync.'
            exit 0
          fi
          if ! python scripts/validate_community_registry_overlay.py copy-source community-candidate; then
            echo '::warning::Unpromoted code or invalid board data; skipping community overlay while continuing PvP sync.'
            exit 0
          fi
          if ! (cd community-candidate && node ../copy-source/scripts/audit-community-release.mjs); then
            echo '::warning::Candidate source ranking or board audit failed; preserving pinned boards and continuing PvP sync.'
            exit 0
          fi
          cp community-candidate/config/community-characters.json copy-source/config/community-characters.json
          cp community-candidate/data/community-character-discovery.json copy-source/data/community-character-discovery.json
          if ! (cd copy-source && node scripts/audit-community-release.mjs); then
            git -C copy-source restore -- config/community-characters.json data/community-character-discovery.json
            echo '::warning::Community registry audit failed; preserving pinned boards and continuing PvP sync.'
            exit 0
          fi
          echo "Audited community registry from exact commit $candidate_sha on promoted code $COPY_SOURCE_SHA"
          echo "Community registry: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Build composite safely
        working-directory: copy-source
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Deploy verified full PvP refresh without mutating board data
        working-directory: copy-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          output_config="$(find dist -type f -name wrangler.json -print -quit)"
          if [ -z "$output_config" ]; then
            echo "Cloudflare Vite output config was not generated."
            exit 1
          fi
          npx wrangler deploy --config "$output_config"

      - name: Verify live PvP matches selected verified full snapshot
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-character-usage.json"
          matched=false
          for attempt in $(seq 1 18); do
            nonce="$(git rev-parse HEAD)-$attempt"
            if curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 \
                "$PRODUCTION_BASE_URL/pvp/data/character_usage.json?deploy=$nonce" -o "$live" \
              && cmp -s copy-source/public/pvp/data/character_usage.json "$live"; then
              matched=true
              break
            fi
            sleep 5
          done
          if [ "$matched" != true ]; then
            echo "Production Worker PvP did not converge to the selected verified full snapshot."
            exit 1
          fi
          jq -e '.target_players == 200 and .sampled_players == 200 and .complete_target == true and .publication_mode == "complete"' "$live" >/dev/null
          python "$GITHUB_WORKSPACE/scripts/validate_public_comparisons.py" "$live"
          live_health="$RUNNER_TEMP/live-character-usage-health.json"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 \
            "$PRODUCTION_BASE_URL/pvp/data/character_usage_health.json?deploy=$(git rev-parse HEAD)" -o "$live_health"
          cmp copy-source/public/pvp/data/character_usage_health.json "$live_health"
          jq -e '.sampled_players == 200 and .complete_target == true and .validated_full_sample == true and .collection_quality.invalid_player_records == 0' "$live_health" >/dev/null
          live_index="$RUNNER_TEMP/production-pvp-index.html"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 10 --retry-delay 3 \
            "$PRODUCTION_BASE_URL/pvp/index.html" -o "$live_index"
          grep -q 'レジェンド帯 キャラ集計' "$live_index"
          echo "Production Worker PvP is pinned to verified full source $PRODUCTION_PVP_SOURCE_SHA."

      - name: Verify live monthly topics and four-language metadata without board writes
        if: ${{ hashFiles('copy-source/app/api/community-topics/route.ts') != '' }}
        run: |
          set -euo pipefail
          calendar_month="$(TZ=Asia/Tokyo date +%Y-%m)"
          registry_month="$(jq -r '[.characters[]?.releaseMonth // empty | select(test("^20[0-9]{2}-(0[1-9]|1[0-2])$"))] | max // empty' copy-source/config/community-characters.json)"
          month="$calendar_month"
          if [ -n "$registry_month" ] && [[ "$registry_month" > "$month" ]]; then
            month="$registry_month"
          fi
          expected="$RUNNER_TEMP/expected-community-topics.json"
          actual="$RUNNER_TEMP/live-community-topics.json"
          jq -S --arg month "$month" '[.characters[] | select(.releaseMonth == $month) | {
            id,name,nameEn:(.nameEn // null),nameZh:(.nameZh // null),nameTh:(.nameTh // null),
            pvpRank:(.pvpRank // null),skillsVerified:(if .source == "pvp-auto" then (.skillsVerified == true) else null end)
          }] | sort_by(.id)' copy-source/config/community-characters.json > "$expected"
          matched=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "$PRODUCTION_BASE_URL/api/community-topics?month=$month&deploy=$attempt" -o "$actual" \
              && jq -e --arg month "$month" '.month == $month and (.characters | type == "array")' "$actual" >/dev/null \
              && jq -S '[.characters[] | {
                id,name,nameEn,nameZh,nameTh,pvpRank,skillsVerified
              }] | sort_by(.id)' "$actual" | cmp -s "$expected" -; then
              matched=true
              break
            fi
            sleep 5
          done
          if [ "$matched" != true ]; then
            echo 'Production Worker standard-month board manifest did not converge to the verified registry.'
            exit 1
          fi
          echo "Read-only live standard-month board audit passed for $month ($(jq length "$expected") distinct character topics)."

      # Collector dispatches use GITHUB_TOKEN and do not produce the usual
      # downstream workflow_run audit. User-started runs retain that trigger.
      # Run the explicit audit only for the collector's bot dispatches.
      - name: Dispatch production visual audit after Worker verification
        if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-visual-audit.yml/dispatches" \
            -f ref=main >/dev/null
          echo 'Dispatched cross-surface production visual audit.'
