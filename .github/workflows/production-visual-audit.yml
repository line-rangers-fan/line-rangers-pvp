name: production-visual-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-visual-audit.yml
  workflow_run:
    workflows: ["deploy-github-pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: line-rangers-production-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Install pinned Chromium harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/lr-visual-audit
          cd /tmp/lr-visual-audit
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright@1.63.0
          npm audit --omit=dev --audit-level=high
          npx playwright install --with-deps chromium

      - name: Audit production at mobile, iPad, and desktop viewports
        env:
          BOARD_OWNER_ACCESS_TOKEN: ${{ secrets.BOARD_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/lr-visual-audit
          if [ -z "${BOARD_OWNER_ACCESS_TOKEN:-}" ]; then
            echo "BOARD_OWNER_ACCESS_TOKEN is required for Owner visual verification."
            exit 78
          fi
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const worker = 'https://line-rangers-pvp-community-production.n-yu1791.workers.dev';
          const pvp = 'https://line-rangers-fan.github.io/line-rangers-pvp/';
          const ownerKey = process.env.BOARD_OWNER_ACCESS_TOKEN;
          const viewports = [
            { name: 'mobile-390x844', width: 390, height: 844 },
            { name: 'ipad-1024x1366', width: 1024, height: 1366 },
            { name: 'desktop-1440x1000', width: 1440, height: 1000 },
          ];
          const targets = [
            { name: 'pvp-pages', url: pvp, kind: 'pvp', mustInclude: ['キャラクターランキング'] },
            { name: 'pvp-worker', url: worker + '/pvp/', kind: 'pvp', mustInclude: ['キャラクターランキング'] },
            { name: 'boards', url: worker + '/boards', kind: 'boards', mustInclude: ['新キャラ情報掲示板', '運営'] },
          ];
          const artifactDir = path.resolve('artifacts');
          await fs.mkdir(artifactDir, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failed = false;

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                reducedMotion: 'reduce',
                locale: 'ja-JP',
              });

              const ownerResponse = await context.request.post(worker + '/api/owner', {
                headers: {
                  Origin: worker,
                  'Sec-Fetch-Site': 'same-origin',
                  'Content-Type': 'application/json',
                },
                data: { key: ownerKey },
              });
              if (ownerResponse.status() !== 200) {
                throw new Error(`Owner activation failed at ${viewport.name}: HTTP ${ownerResponse.status()}`);
              }

              for (const target of targets) {
                const page = await context.newPage();
                const pageErrors = [];
                const consoleErrors = [];
                page.on('pageerror', error => pageErrors.push(String(error)));
                page.on('console', msg => {
                  if (msg.type() === 'error') consoleErrors.push(msg.text());
                });

                const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (!response || !response.ok()) {
                  throw new Error(`${target.name} navigation failed at ${viewport.name}: HTTP ${response?.status() ?? 'no-response'}`);
                }
                await page.waitForTimeout(2500);

                const comparisonStates = {};
                if (target.kind === 'pvp') {
                  await page.waitForSelector('#ranking-body tr', { timeout: 15000 });
                  for (const period of ['hour', 'day', 'week', 'month']) {
                    await page.evaluate((selected) => {
                      const option = document.querySelector(`[data-rank-period="${selected}"]`);
                      if (!(option instanceof HTMLButtonElement)) {
                        throw new Error(`Missing comparison period button: ${selected}`);
                      }
                      option.click();
                    }, period);
                    await page.waitForTimeout(100);
                    const comparisonState = await page.evaluate(() => ({
                      rows: document.querySelectorAll('#ranking-body tr').length,
                      badges: document.querySelectorAll('#ranking-body .rank-period-change').length,
                      pending: document.querySelectorAll('#ranking-body .rank-period-pending:not(.rank-period-source-pending)').length,
                      sourcePending: document.querySelectorAll('#ranking-body .rank-period-source-pending').length,
                    }));
                    comparisonStates[period] = comparisonState;
                    if (
                      comparisonState.rows === 0 ||
                      comparisonState.badges !== comparisonState.rows ||
                      comparisonState.pending !== 0 ||
                      (comparisonState.sourcePending !== 0 && comparisonState.sourcePending !== comparisonState.rows)
                    ) {
                      throw new Error(
                        `${target.name} rendered invalid ${period} comparison badges at ${viewport.name}: ${JSON.stringify(comparisonState)}`,
                      );
                    }
                  }

                  const firstCharacterUnit = await page.locator('#ranking-body .character-button').first().getAttribute('data-unit-code');
                  await page.locator('#ranking-body .character-button').first().click();
                  await page.waitForSelector('#equipment-dialog[open] .equipment-table tbody tr', { timeout: 15000 });
                  await page.waitForSelector('#equipment-dialog[open] .equipment-character-name', { timeout: 15000 });
                  await page.waitForSelector('#equipment-dialog[open] .equipment-skill-item', { timeout: 20000 });
                  await page.waitForFunction(() => {
                    const images = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-image')];
                    return images.length > 0 && images.every((image) => image.complete);
                  }, { timeout: 20000 });
                  const rangerDetailState = await page.evaluate(() => {
                    const link = document.querySelector('#equipment-dialog[open] .equipment-character-name');
                    const skillList = document.querySelector('#equipment-dialog[open] .equipment-skill-list');
                    const summary = document.querySelector('#equipment-dialog[open] .equipment-summary');
                    const firstSkill = document.querySelector('#equipment-dialog[open] .equipment-skill-item');
                    const firstHeader = document.querySelector('#equipment-dialog[open] .equipment-skill-header');
                    const firstVisual = document.querySelector('#equipment-dialog[open] .equipment-skill-visual');
                    const firstSkillName = document.querySelector('#equipment-dialog[open] .equipment-skill-name');
                    const items = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-item')];
                    const images = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-image')];
                    const effects = document.querySelectorAll('#equipment-dialog[open] .equipment-skill-effects');
                    const summaryRect = summary?.getBoundingClientRect();
                    const skillListRect = skillList?.getBoundingClientRect();
                    const firstRect = items[0]?.getBoundingClientRect();
                    const secondRect = items[1]?.getBoundingClientRect();
                    const visualRect = firstVisual?.getBoundingClientRect();
                    const nameRect = firstSkillName?.getBoundingClientRect();
                    return {
                      name: link?.textContent?.trim() || '',
                      href: link instanceof HTMLAnchorElement ? link.href : '',
                      linkColor: link ? getComputedStyle(link).color : '',
                      skillItems: items.length,
                      skillItemsExpectingEffects: items.filter((item) => item.dataset.hasEffects === 'true').length,
                      skillImages: images.length,
                      loadedSkillImages: images.filter((image) => image.complete && image.naturalWidth > 0 && image.naturalHeight > 0).length,
                      effectGroups: effects.length,
                      separatedEffects: [...effects].every((effectsBlock) => {
                        const description = effectsBlock.parentElement?.querySelector('.equipment-skill-description');
                        if (!(description instanceof HTMLElement)) return true;
                        const descriptionRect = description.getBoundingClientRect();
                        const effectsRect = effectsBlock.getBoundingClientRect();
                        const marginTop = Number.parseFloat(getComputedStyle(effectsBlock).marginTop || '0');
                        return effectsRect.top > descriptionRect.bottom && marginTop >= 8;
                      }),
                      skillHeaderDisplay: firstHeader ? getComputedStyle(firstHeader).display : '',
                      skillHeaderAlignItems: firstHeader ? getComputedStyle(firstHeader).alignItems : '',
                      skillIconWidth: visualRect ? Math.round(visualRect.width * 10) / 10 : 0,
                      skillIconHeight: visualRect ? Math.round(visualRect.height * 10) / 10 : 0,
                      skillIconBesideName: visualRect && nameRect
                        ? Math.abs((visualRect.top + visualRect.height / 2) - (nameRect.top + nameRect.height / 2)) < 8
                          && nameRect.left > visualRect.right
                        : false,
                      skillListGridAutoFlow: skillList ? getComputedStyle(skillList).gridAutoFlow : '',
                      skillListOverflowX: skillList ? getComputedStyle(skillList).overflowX : '',
                      mobileSkillListLeftGap: summaryRect && skillListRect
                        ? Math.round((skillListRect.left - summaryRect.left) * 10) / 10
                        : null,
                      skillItemsHorizontal: !secondRect || !firstRect
                        ? true
                        : Math.abs(secondRect.top - firstRect.top) < 4 && secondRect.left > firstRect.left,
                      legacyMeta: document.querySelectorAll('#equipment-dialog[open] .equipment-meta').length,
                    };
                  });
                  const expectedRangerHref = firstCharacterUnit
                    ? `https://rangers.lerico.net/ja/ranger/${encodeURIComponent(firstCharacterUnit)}`
                    : '';
                  if (
                    !firstCharacterUnit ||
                    !rangerDetailState.name ||
                    rangerDetailState.href !== expectedRangerHref ||
                    rangerDetailState.linkColor !== 'rgb(96, 165, 250)' ||
                    rangerDetailState.skillItems < 1 ||
                    rangerDetailState.skillImages !== rangerDetailState.skillItems ||
                    rangerDetailState.loadedSkillImages !== rangerDetailState.skillImages ||
                    rangerDetailState.effectGroups !== rangerDetailState.skillItemsExpectingEffects ||
                    !rangerDetailState.separatedEffects ||
                    rangerDetailState.skillHeaderDisplay !== 'flex' ||
                    rangerDetailState.skillHeaderAlignItems !== 'center' ||
                    rangerDetailState.skillIconWidth < 28 ||
                    rangerDetailState.skillIconWidth > 40 ||
                    rangerDetailState.skillIconHeight !== rangerDetailState.skillIconWidth ||
                    !rangerDetailState.skillIconBesideName ||
                    (viewport.width <= 600 && rangerDetailState.skillListGridAutoFlow !== 'column') ||
                    (viewport.width <= 600 && !['auto', 'scroll'].includes(rangerDetailState.skillListOverflowX)) ||
                    (viewport.width <= 600 && (rangerDetailState.mobileSkillListLeftGap == null || rangerDetailState.mobileSkillListLeftGap > 12)) ||
                    (viewport.width <= 600 && !rangerDetailState.skillItemsHorizontal) ||
                    rangerDetailState.legacyMeta !== 0
                  ) {
                    throw new Error(
                      `${target.name} rendered invalid Ranger detail at ${viewport.name}: ${JSON.stringify({ firstCharacterUnit, ...rangerDetailState })}`,
                    );
                  }
                  await page.locator('[data-language="en"]').click();
                  await page.waitForFunction((unitCode) => {
                    const link = document.querySelector('#equipment-dialog[open] .equipment-character-name');
                    const skills = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-name')];
                    return (
                      document.documentElement.lang === 'en' &&
                      link instanceof HTMLAnchorElement &&
                      link.href === `https://rangers.lerico.net/en/ranger/${encodeURIComponent(unitCode)}` &&
                      skills.length > 0
                    );
                  }, firstCharacterUnit, { timeout: 20000 });
                  const englishRangerState = await page.evaluate(() => {
                    const link = document.querySelector('#equipment-dialog[open] .equipment-character-name');
                    const skillNames = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-name')].map(node => node.textContent?.trim() || '');
                    const descriptions = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-description')].map(node => node.textContent?.trim() || '');
                    const effects = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-effects li')].map(node => node.textContent?.trim() || '');
                    const effectLabels = [...document.querySelectorAll('#equipment-dialog[open] .equipment-skill-effects-label')].map(node => node.textContent?.trim() || '');
                    const text = [link?.textContent?.trim() || '', ...skillNames, ...descriptions, ...effects].join('\n');
                    return {
                      lang: document.documentElement.lang,
                      href: link instanceof HTMLAnchorElement ? link.href : '',
                      name: link?.textContent?.trim() || '',
                      skillNames,
                      descriptions,
                      effects,
                      effectLabels,
                      containsJapaneseScript: /[ぁ-んァ-ヶ一-龠]/u.test(text),
                    };
                  });
                  if (
                    englishRangerState.lang !== 'en' ||
                    englishRangerState.href !== `https://rangers.lerico.net/en/ranger/${encodeURIComponent(firstCharacterUnit)}` ||
                    !englishRangerState.name ||
                    englishRangerState.skillNames.length < 1 ||
                    englishRangerState.descriptions.length < 1 ||
                    englishRangerState.effectLabels.some(label => label !== 'Skill effects') ||
                    englishRangerState.containsJapaneseScript
                  ) {
                    throw new Error(
                      `${target.name} rendered invalid English Ranger detail at ${viewport.name}: ${JSON.stringify(englishRangerState)}`,
                    );
                  }
                  await page.locator('[data-language="ja"]').click();
                  await page.waitForFunction(() => document.documentElement.lang === 'ja', undefined, { timeout: 10000 });

                  const equipmentComparisonStates = {};
                  for (const period of ['hour', 'day', 'week', 'month']) {
                    await page.evaluate((selected) => {
                      const option = document.querySelector(`[data-rank-period="${selected}"]`);
                      if (!(option instanceof HTMLButtonElement)) {
                        throw new Error(`Missing comparison period button: ${selected}`);
                      }
                      option.click();
                    }, period);
                    await page.waitForTimeout(100);
                    const equipmentState = await page.evaluate(() => ({
                      rows: document.querySelectorAll('#equipment-dialog[open] .equipment-table tbody tr').length,
                      badges: document.querySelectorAll('#equipment-dialog[open] .equipment-table .rank-period-change').length,
                      pending: document.querySelectorAll('#equipment-dialog[open] .equipment-table .rank-period-pending:not(.rank-period-source-pending)').length,
                      sourcePending: document.querySelectorAll('#equipment-dialog[open] .equipment-table .rank-period-source-pending').length,
                    }));
                    equipmentComparisonStates[period] = equipmentState;
                    if (
                      equipmentState.rows === 0 ||
                      equipmentState.badges !== equipmentState.rows ||
                      equipmentState.pending !== 0 ||
                      (equipmentState.sourcePending !== 0 && equipmentState.sourcePending !== equipmentState.rows)
                    ) {
                      throw new Error(
                        `${target.name} rendered invalid equipment ${period} comparison badges at ${viewport.name}: ${JSON.stringify(equipmentState)}`,
                      );
                    }
                  }
                  await page.locator('#equipment-close').click();
                  comparisonStates.equipment = equipmentComparisonStates;
                }

                const state = await page.evaluate(() => {
                  const root = document.documentElement;
                  const body = document.body;
                  const allElements = [...document.querySelectorAll('body *')];
                  const overflowing = allElements.flatMap((element) => {
                    const style = getComputedStyle(element);
                    const rect = element.getBoundingClientRect();
                    const hidden =
                      style.display === 'none' ||
                      style.visibility === 'hidden' ||
                      Number(style.opacity || '1') === 0 ||
                      rect.width === 0 ||
                      rect.height === 0;
                    if (hidden) return [];
                    if (rect.left < -2 || rect.right > window.innerWidth + 2) {
                      return [{
                        tag: element.tagName,
                        id: element.id || '',
                        className: typeof element.className === 'string' ? element.className.slice(0, 120) : '',
                        text: (element.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100),
                        left: Math.round(rect.left),
                        right: Math.round(rect.right),
                        width: Math.round(rect.width),
                        overflowX: style.overflowX,
                      }];
                    }
                    return [];
                  }).slice(0, 40);
                  const interactive = [...document.querySelectorAll('a,button,input,textarea,select')];
                  const clipped = interactive.flatMap((element) => {
                    const style = getComputedStyle(element);
                    const rect = element.getBoundingClientRect();
                    const hidden =
                      style.display === 'none' ||
                      style.visibility === 'hidden' ||
                      Number(style.opacity || '1') === 0 ||
                      rect.width === 0 ||
                      rect.height === 0;
                    if (hidden) return [];
                    if (rect.left < -2 || rect.right > window.innerWidth + 2) {
                      return [{
                        tag: element.tagName,
                        text: (element.textContent || element.getAttribute('aria-label') || '').trim().slice(0, 80),
                        left: Math.round(rect.left),
                        right: Math.round(rect.right),
                        width: Math.round(rect.width),
                      }];
                    }
                    return [];
                  });
                  return {
                    title: document.title,
                    text: body?.innerText || '',
                    innerWidth: window.innerWidth,
                    rootScrollWidth: root.scrollWidth,
                    bodyScrollWidth: body?.scrollWidth || 0,
                    overflowing,
                    clipped,
                  };
                });

                const horizontalOverflow = Math.max(state.rootScrollWidth, state.bodyScrollWidth) > state.innerWidth + 2;
                const missing = target.mustInclude.filter(text => !state.text.includes(text));
                const shieldFound = target.name === 'boards' && state.text.includes('🛡');
                const screenshot = path.join(artifactDir, `${target.name}-${viewport.name}.png`);
                await page.screenshot({ path: screenshot, fullPage: true });

                const result = {
                  target: target.name,
                  viewport,
                  httpStatus: response.status(),
                  horizontalOverflow,
                  rootScrollWidth: state.rootScrollWidth,
                  bodyScrollWidth: state.bodyScrollWidth,
                  overflowing: state.overflowing,
                  clipped: state.clipped,
                  missing,
                  shieldFound,
                  comparisonStates,
                  pageErrors,
                  consoleErrors,
                  screenshot,
                };
                results.push(result);

                if (horizontalOverflow || state.clipped.length || missing.length || shieldFound || pageErrors.length || consoleErrors.length) {
                  failed = true;
                }
                await page.close();
              }
              await context.close();
            }

            async function verifyViewerRoundTrip(ownerMode) {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
                reducedMotion: 'reduce',
                locale: 'ja-JP',
              });
              const name = ownerMode ? 'owner-viewer-roundtrip' : 'viewer-roundtrip';
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));

              try {
                if (ownerMode) {
                  const ownerResponse = await context.request.post(worker + '/api/owner', {
                    headers: {
                      Origin: worker,
                      'Sec-Fetch-Site': 'same-origin',
                      'Content-Type': 'application/json',
                    },
                    data: { key: ownerKey },
                  });
                  if (ownerResponse.status() !== 200) {
                    throw new Error(`Owner activation failed in round trip: HTTP ${ownerResponse.status()}`);
                  }
                }

                const topResponse = await page.goto(pvp, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (!topResponse || !topResponse.ok()) {
                  throw new Error(`PvP navigation failed in ${name}: HTTP ${topResponse?.status() ?? 'no-response'}`);
                }
                await page.waitForSelector('.community-board-entry-button', { state: 'visible', timeout: 20000 });
                await page.waitForFunction(() => {
                  const token = localStorage.getItem('line-rangers-community-viewer-v1') || '';
                  return /^v1[.][a-f0-9-]{36}[.][0-9]+[.][A-Za-z0-9_-]{43}$/.test(token);
                }, undefined, { timeout: 20000 });

                const viewerBefore = await page.evaluate(() => localStorage.getItem('line-rangers-community-viewer-v1') || '');
                const unreadBefore = (await page.locator('.community-board-entry-stat-unread').innerText()).trim();
                const boardHref = await page.locator('.community-board-entry-button').getAttribute('href');
                if (!boardHref) throw new Error(`Board href missing in ${name}`);
                const linkedViewer = new URL(boardHref).searchParams.get('viewer') || '';
                if (linkedViewer !== viewerBefore) {
                  throw new Error(`Board link Viewer token mismatch in ${name}`);
                }

                await Promise.all([
                  page.waitForURL(url => url.origin === worker && url.pathname === '/boards', { timeout: 30000 }),
                  page.locator('.community-board-entry-button').click(),
                ]);
                await page.waitForFunction(() => !new URL(location.href).searchParams.has('viewer'), undefined, { timeout: 20000 });
                await page.waitForTimeout(1800);

                const boardUrl = page.url();
                if (new URL(boardUrl).searchParams.has('viewer')) {
                  throw new Error(`Viewer token remained in board URL in ${name}`);
                }

                const boardState = await page.evaluate(async token => {
                  const response = await fetch('/api/board?viewer=' + encodeURIComponent(token), {
                    cache: 'no-store',
                    credentials: 'same-origin',
                  });
                  if (!response.ok) throw new Error('board_api_' + response.status);
                  return await response.json();
                }, viewerBefore);

                if (Number(boardState?.stats?.unread) !== 0) {
                  throw new Error(`Board unread did not clear for ${name}: ${boardState?.stats?.unread}`);
                }
                if (ownerMode && boardState?.me?.role !== 'owner') {
                  throw new Error(`Owner role was lost while using Viewer token: ${boardState?.me?.role}`);
                }
                if (!ownerMode && boardState?.me?.role === 'owner') {
                  throw new Error('Normal Viewer unexpectedly gained Owner role');
                }

                await page.screenshot({ path: path.join(artifactDir, `${name}-board.png`), fullPage: true });

                const backResponsePromise = page.waitForURL(url => url.origin === new URL(pvp).origin, { timeout: 30000 });
                await page.goBack({ waitUntil: 'domcontentloaded', timeout: 30000 });
                await backResponsePromise;
                await page.waitForSelector('.community-board-entry-stat-unread', { state: 'visible', timeout: 20000 });
                await page.waitForFunction(() => {
                  const el = document.querySelector('.community-board-entry-stat-unread');
                  return !!el && /0/.test(el.textContent || '');
                }, undefined, { timeout: 20000 });

                const viewerAfter = await page.evaluate(() => localStorage.getItem('line-rangers-community-viewer-v1') || '');
                const unreadAfter = (await page.locator('.community-board-entry-stat-unread').innerText()).trim();
                if (viewerAfter !== viewerBefore) {
                  throw new Error(`Viewer token changed after board round trip in ${name}`);
                }
                if (!/0/.test(unreadAfter)) {
                  throw new Error(`PvP NEW did not stay at zero after board round trip in ${name}: ${unreadAfter}`);
                }

                await page.screenshot({ path: path.join(artifactDir, `${name}-pvp-return.png`), fullPage: true });
                results.push({
                  target: name,
                  viewport: { name: 'mobile-390x844', width: 390, height: 844 },
                  viewerStable: true,
                  viewerPassedInLink: true,
                  viewerScrubbedFromUrl: true,
                  unreadBefore,
                  boardUnread: Number(boardState?.stats?.unread),
                  unreadAfter,
                  ownerRole: boardState?.me?.role || null,
                  pageErrors,
                });
                if (pageErrors.length) failed = true;
              } catch (error) {
                failed = true;
                results.push({
                  target: name,
                  viewport: { name: 'mobile-390x844', width: 390, height: 844 },
                  error: String(error),
                  pageErrors,
                });
              } finally {
                await context.close();
              }
            }

            await verifyViewerRoundTrip(false);
            await verifyViewerRoundTrip(true);
          } finally {
            await browser.close();
          }

          await fs.writeFile(path.join(artifactDir, 'results.json'), JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (failed) process.exit(1);
          EOF
          node audit.mjs

      - name: Upload production visual audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: line-rangers-production-visual-audit-${{ github.run_id }}
          path: /tmp/lr-visual-audit/artifacts
          retention-days: 14
          if-no-files-found: error
