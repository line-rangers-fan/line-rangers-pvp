name: patch-partial-visual-audit

on:
  push:
    branches: [fix/partial-visual-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/partial-visual-audit
      - name: Relax only the visual-audit synchronization gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-visual-audit.yml')
          text = path.read_text(encoding='utf-8')
          old = "'.target_players == 200 and .sampled_players == 200 and .complete_target == true'"
          new = "'.target_players == 200 and (.sampled_players | type == \"number\") and .sampled_players > 0 and .sampled_players <= 200 and ((.sampled_players == 200 and .complete_target == true and .publication_mode == \"complete\") or (.sampled_players < 200 and .complete_target == false and .publication_mode == \"partial_after_stale\"))'"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two strict sample predicates, found {count}')
          text = text.replace(old, new)
          old_echo = 'Pages and Worker PvP snapshots are synchronized at 200/200 with matching health periods.'
          new_echo = 'Pages and Worker PvP snapshots are synchronized at the same nonzero publishable sample with matching health periods.'
          if old_echo not in text:
              raise SystemExit('strict synchronization message not found')
          text = text.replace(old_echo, new_echo, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/production-visual-audit.yml
      - name: Commit patched audit workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-visual-audit.yml
          git commit -m 'Allow partial snapshots in production visual audit'
          git push origin HEAD:fix/partial-visual-audit
