name: diagnose-ranger-info-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-ranger-info-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect u1616e-brown source mapping
        run: |
          set -euo pipefail
          basics="$(mktemp)"
          skills="$(mktemp)"
          translations="$(mktemp)"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30             'https://rangers.lerico.net/api/getRangersBasics' > "$basics"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30             'https://rangers.lerico.net/api/getSkills' > "$skills"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30             'https://rangers.lerico.net/api/v2/translate?keys=ja%3ASKILL%2Cja%3AUNIT' > "$translations"

          ranger="$(jq -cer '.[] | select(.unitCode=="u1616e-brown") | {
            unitCode,unitNameCode,grade,isTranscendentUnit,isHyperUnit,
            iconSkillCode,skillCode,iconSkillCode2,skillCode2,iconSkillCode3,skillCode3
          }' "$basics")"
          echo "TARGET_RANGER=$ranger"

          mapfile -t codes < <(printf '%s' "$ranger" | jq -r '[.skillCode,.skillCode2,.skillCode3,.iconSkillCode,.iconSkillCode2,.iconSkillCode3] | map(select(type=="string" and length>0)) | unique | .[]')
          for code in "${codes[@]}"; do
            echo "TARGET_SKILL_CODE=$code"
            jq -cer --arg code "$code" '.[] | select(.skillCode==$code) | {skillCode,nameCode,descriptionCode,iconResourcePath}' "$skills" || true
          done

          jq -cer '{
            unitName: ."ja:UNIT"."u1616e-brown_nm",
            matchingSkillTranslations: (."ja:SKILL" | with_entries(select(.key|test("1615|1616|sk11|brown";"i"))))
          }' "$translations"
