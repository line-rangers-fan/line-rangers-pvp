name: collection-incident-guardian

on:
  workflow_run:
    workflows: ["scrape-and-deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: collection-incident-guardian
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or resolve the collection incident
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const incidentTitle = "自動集計の連続障害を検出しました";
            const failureConclusions = new Set([
              "failure", "timed_out", "action_required", "startup_failure",
            ]);
            const retryableSteps = new Set([
              "Run scraper",
              "Rebuild verified comparisons",
              "Validate publishable snapshot after repair",
              "Save collected data",
              "Dispatch synchronized PvP publication",
            ]);

            let current = context.payload.workflow_run;
            if (!current) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "update-character-usage.yml",
                branch: "main",
                status: "completed",
                per_page: 10,
              });
              current = response.data.workflow_runs[0];
            }
            if (!current) {
              core.notice("No completed collection workflow was found.");
              return;
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.data.find(
              (issue) => !issue.pull_request && issue.title === incidentTitle,
            );

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: current.id,
              per_page: 100,
            });
            const scraperSucceeded = jobs.data.jobs.some((job) =>
              (job.steps || []).some(
                (step) => step.name === "Run scraper" && step.conclusion === "success",
              ),
            );
            if (current.conclusion === "success") {
              if (existing && scraperSucceeded) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `正常な200人集計を確認したため、自動的に復旧済みとします。\n\n確認した実行: ${current.html_url}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            if (!failureConclusions.has(current.conclusion)) return;

            const failedSteps = jobs.data.jobs.flatMap((job) =>
              (job.steps || [])
                .filter((step) => step.conclusion === "failure" || step.conclusion === "timed_out")
                .map((step) => step.name),
            );
            const retryableFailure = failedSteps.some((name) => retryableSteps.has(name));
            const attempt = Number(current.run_attempt || 1);

            if (attempt === 1 && retryableFailure) {
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: current.id,
              });
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `新しい実行で一時障害を検出したため、この実行にも1回だけ自動再試行をかけました。\n\n実行: ${current.html_url}\n失敗ステップ: ${failedSteps.join(", ") || "不明"}`,
                });
              }
              core.notice(
                `Transient collection failure detected at ${failedSteps.join(", ")}; one automatic retry was requested for this run.`,
              );
              return;
            }

            if (existing) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: incidentTitle,
              body: [
                retryableFailure
                  ? "主集計の一時障害が自動再試行後も解消しませんでした。前回の正常データは維持されています。"
                  : "主集計の品質・整合性ゲートで停止しました。前回の正常データは維持されています。",
                "",
                `実行: ${current.html_url}`,
                `run attempt: ${attempt}`,
                `失敗ステップ: ${failedSteps.join(", ") || "不明"}`,
                "",
                "200/200、比較整合性、公開データの品質基準は自動では緩めません。",
                "一時的な取得・保存・dispatch失敗だけを1回自動再試行し、それ以外は安全側に停止します。",
                "正常な200人集計が成功すると、このIssueは自動的に閉じられます。",
              ].join("\n"),
            });
