name: deploy-cloudflare-watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare-watchdog/**"
      - ".github/workflows/deploy-cloudflare-watchdog.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account ID
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er             '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and Cron trigger
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          workingDirectory: infra/cloudflare-watchdog
          command: deploy

      - name: Set Worker GitHub dispatch secret
        working-directory: infra/cloudflare-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "::warning::GITHUB_ACTIONS_TOKEN is not configured yet; repair dispatch is disabled."
            exit 0
          fi
          printf '%s' "$WORKFLOW_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_TOKEN
