name: ranking-freshness-watchdog

on:
  workflow_dispatch:
  schedule:
    # This independent workflow checks between the collector's two slots.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: pvp-freshness-watchdog
  cancel-in-progress: false

jobs:
  repair-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check published data age
        id: freshness
        run: |
          python scripts/check_data_freshness.py \
            --max-age-minutes 55 \
            --github-output "$GITHUB_OUTPUT"

      - name: Check for an active collection
        id: active
        if: steps.freshness.outputs.due == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const activeStatuses = new Set([
              "requested", "waiting", "pending", "queued", "in_progress",
            ]);
            let active = false;
            try {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "update-character-usage.yml",
                branch: "main",
                per_page: 20,
              });
              active = response.data.workflow_runs.some(
                (run) => activeStatuses.has(run.status),
              );
            } catch {
              // Fail open: an inspection problem must not disable recovery.
              core.warning("Could not inspect active collection; repair dispatch remains enabled.");
            }
            core.setOutput("active", active ? "true" : "false");

      - name: Trigger a repair collection
        if: >-
          steps.freshness.outputs.due == 'true' &&
          steps.active.outputs.active != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-character-usage.yml",
              ref: "main",
              inputs: { force_collection: "true" },
            });

      - name: Report existing active recovery
        if: >-
          steps.freshness.outputs.due == 'true' &&
          steps.active.outputs.active == 'true'
        run: echo "A collection is already queued or running; no duplicate was added."
