name: deploy-original-community-production

# Manual fallback only. The validated copy migration workflow performs the
# approved one-time promotion; this path is available after a token with D1/R2
# management permissions is configured in the original repository.

# The original PvP repository remains the canonical production entry point.
# The community application is built from the validated copy commit and uses
# production-only D1/R2 resources, never the review resources.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-rangers-original-community-production
  cancel-in-progress: false

env:
  COPY_SOURCE_SHA: e53550e74ed9b972d23a0753266228cb8162d11b
  WORKER_NAME: line-rangers-pvp-community-production
  REVIEW_WORKER_NAME: line-rangers-pvp-community-review
  D1_NAME: line-rangers-pvp-production-db
  R2_BUCKET: line-rangers-pvp-production-media
  PRODUCTION_BASE_URL: https://line-rangers-pvp-community-production.n-yu1791.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out original repository
        uses: actions/checkout@v4

      - name: Fetch validated copy source
        env:
          COPY_SOURCE_SHA: ${{ env.COPY_SOURCE_SHA }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --no-tags https://github.com/nyu1791-collab/copy-LINE-.git copy-source
          git -C copy-source fetch --depth=1 origin "$COPY_SOURCE_SHA"
          git -C copy-source checkout --detach "$COPY_SOURCE_SHA"
          test "$(git -C copy-source rev-parse HEAD)" = "$COPY_SOURCE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: copy-source/package-lock.json

      - name: Install locked dependencies
        working-directory: copy-source
        run: npm run install:ci

      - name: Resolve Cloudflare account safely
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_BOARD_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_BOARD_API_TOKEN is required for the original production deployment."
            exit 78
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_BOARD_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          if ! [[ "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Create or verify original D1 and R2 resources
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail

          db_list="$(npx wrangler d1 list --json)"
          db_id="$(printf '%s' "$db_list" | jq -r --arg name "$D1_NAME" '[.[] | select(.name == $name) | .uuid][0] // empty')"
          if [ -z "$db_id" ]; then
            created="$(npx wrangler d1 create "$D1_NAME" --json)"
            db_id="$(printf '%s' "$created" | jq -er '.uuid // .result.uuid // .database_id')"
          fi
          if ! [[ "$db_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "Unable to resolve the original production D1 database ID."
            exit 1
          fi
          echo "::add-mask::$db_id"

          if ! npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

          tmp="$(mktemp)"
          jq --arg id "$db_id" --arg db "$D1_NAME" --arg bucket "$R2_BUCKET" --arg worker "$WORKER_NAME" '
            .name = $worker
            | (.d1_databases[] | select(.binding == "DB") | .database_name) = $db
            | (.d1_databases[] | select(.binding == "DB") | .database_id) = $id
            | (.r2_buckets[] | select(.binding == "BUCKET") | .bucket_name) = $bucket
          ' wrangler.jsonc > "$tmp"
          mv "$tmp" wrangler.jsonc
          grep -q "$db_id" wrangler.jsonc
          grep -q "$R2_BUCKET" wrangler.jsonc

      - name: Build and run regression tests
        working-directory: copy-source
        run: |
          set -euo pipefail
          npm test
          npm run lint

      - name: Apply original production D1 migrations
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy original community Worker
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          output_config="$(find dist -type f -name wrangler.json -print -quit)"
          if [ -z "$output_config" ]; then
            echo "Cloudflare Vite output config was not generated."
            find dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          npx wrangler deploy --config "$output_config"

      - name: Preserve or initialize original anonymous signing secret
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
          if ! printf '%s' "$secrets_json" | jq -e '.[] | select(.name == "BOARD_ANON_COOKIE_SECRET")' >/dev/null; then
            openssl rand -hex 48 | npx wrangler secret put BOARD_ANON_COOKIE_SECRET --name "$WORKER_NAME"
          fi

      - name: Apply Owner secrets to production and review Workers
        working-directory: copy-source
        env:
          CLOUDFLARE_BOARD_API_TOKEN: ${{ secrets.CLOUDFLARE_BOARD_API_TOKEN }}
          BOARD_OWNER_ACCESS_TOKEN: ${{ secrets.BOARD_OWNER_ACCESS_TOKEN }}
          BOARD_OWNER_SUBJECT: ${{ secrets.BOARD_OWNER_SUBJECT }}
        run: |
          set -euo pipefail
          if [ -z "${BOARD_OWNER_ACCESS_TOKEN:-}" ] || [ -z "${BOARD_OWNER_SUBJECT:-}" ]; then
            echo "Owner bootstrap secrets are not configured; both Workers remain public/anonymous."
            exit 0
          fi
          for worker in "$WORKER_NAME" "$REVIEW_WORKER_NAME"; do
            printf '%s' "$BOARD_OWNER_ACCESS_TOKEN" | npx wrangler secret put BOARD_OWNER_ACCESS_TOKEN --name "$worker"
            printf '%s' "$BOARD_OWNER_SUBJECT" | npx wrangler secret put BOARD_OWNER_SUBJECT --name "$worker"
          done

      - name: Verify original production Worker
        working-directory: copy-source
        run: |
          set -euo pipefail
          pvp="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$PRODUCTION_BASE_URL/pvp/index.html")"
          board="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$PRODUCTION_BASE_URL/boards")"
          snapshot="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$PRODUCTION_BASE_URL/pvp/data/character_usage.json")"
          health="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$PRODUCTION_BASE_URL/api/health")"
          api="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$PRODUCTION_BASE_URL/api/board")"

          grep -q 'レジェンド帯 キャラ集計' <<< "$pvp"
          grep -q '新キャラ情報掲示板' <<< "$board"
          printf '%s' "$snapshot" | jq -e '.target_players == 200 and .sampled_players == 200 and .complete_target == true' >/dev/null
          printf '%s' "$health" | jq -e '.ok == true and .checks.d1 == true and .checks.r2 == true' >/dev/null
          printf '%s' "$api" | jq -e '.boards | type == "array"' >/dev/null
          echo "Original production community Worker verified: $PRODUCTION_BASE_URL"
