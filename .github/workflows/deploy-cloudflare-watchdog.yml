name: deploy-cloudflare-watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare-watchdog/**"
      - ".github/workflows/deploy-cloudflare-watchdog.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker and Cron trigger
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare-watchdog
          command: deploy

      - name: Set Worker GitHub dispatch secret
        working-directory: infra/cloudflare-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "GITHUB_ACTIONS_TOKEN repository secret is required."
            exit 1
          fi
          printf '%s' "$WORKFLOW_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_TOKEN
