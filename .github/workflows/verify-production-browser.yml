name: verify-production-browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-production-browser.yml

permissions:
  contents: read

concurrency:
  group: line-rangers-production-browser
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Locate preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "A preinstalled Chrome/Chromium binary is required."
            exit 78
          fi
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Run production browser viewport checks
        shell: bash
        env:
          PVP_URL: https://line-rangers-fan.github.io/line-rangers-pvp/
          BOARD_URL: https://line-rangers-pvp-community-production.n-yu1791.workers.dev/boards
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          cat > /tmp/lr-browser-check.mjs <<'NODE'
          import {spawn} from 'node:child_process';
          import {mkdtempSync, writeFileSync, rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';

          const [url,widthRaw,heightRaw,kind,pngPath,jsonPath] = process.argv.slice(2);
          const width=Number(widthRaw), height=Number(heightRaw);
          if(!url||!Number.isInteger(width)||!Number.isInteger(height)||!kind||!pngPath||!jsonPath) throw new Error('invalid arguments');
          if(typeof WebSocket==='undefined') throw new Error('Node WebSocket API unavailable');

          const profile=mkdtempSync(join(tmpdir(),'lr-browser-'));
          const port=9222;
          const chrome=spawn(process.env.CHROME_BIN,[
            '--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage',
            '--no-first-run','--disable-background-networking','--disable-component-update',
            `--remote-debugging-port=${port}`,`--user-data-dir=${profile}`,'about:blank'
          ],{stdio:['ignore','ignore','pipe']});
          let stderr='';
          chrome.stderr.on('data',chunk=>{stderr+=String(chunk);});

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(path){
            let last;
            for(let i=0;i<80;i++){
              try{const r=await fetch(`http://127.0.0.1:${port}${path}`);if(r.ok)return await r.json();last=new Error(`HTTP ${r.status}`);}catch(e){last=e;}
              await sleep(125);
            }
            throw last||new Error('Chrome debugging endpoint unavailable');
          }

          let ws;
          try{
            await getJson('/json/version');
            const targets=await getJson('/json/list');
            const page=targets.find(t=>t.type==='page');
            if(!page?.webSocketDebuggerUrl) throw new Error('Chrome page target unavailable');
            ws=new WebSocket(page.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(new Error('WebSocket open timeout')),10000);
              ws.addEventListener('open',()=>{clearTimeout(timer);resolve();},{once:true});
              ws.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('WebSocket connection failed'));},{once:true});
            });

            let nextId=0;
            const pending=new Map();
            const waiters=new Map();
            ws.addEventListener('message',event=>{
              const msg=JSON.parse(String(event.data));
              if(msg.id){
                const p=pending.get(msg.id);
                if(!p)return;
                pending.delete(msg.id);
                if(msg.error)p.reject(new Error(JSON.stringify(msg.error))); else p.resolve(msg.result);
                return;
              }
              const list=waiters.get(msg.method);
              if(list?.length){
                const fn=list.shift();
                fn(msg.params||{});
              }
            });
            function send(method,params={}){
              return new Promise((resolve,reject)=>{
                const id=++nextId;
                pending.set(id,{resolve,reject});
                ws.send(JSON.stringify({id,method,params}));
                setTimeout(()=>{if(pending.delete(id))reject(new Error(`${method} timeout`));},20000);
              });
            }
            function waitEvent(method,timeout=30000){
              return new Promise((resolve,reject)=>{
                const list=waiters.get(method)||[];
                const timer=setTimeout(()=>{
                  const current=waiters.get(method)||[];
                  const idx=current.indexOf(done); if(idx>=0)current.splice(idx,1);
                  reject(new Error(`${method} event timeout`));
                },timeout);
                const done=params=>{clearTimeout(timer);resolve(params);};
                list.push(done); waiters.set(method,list);
              });
            }

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride',{
              width,height,deviceScaleFactor:1,mobile:width<=500,screenWidth:width,screenHeight:height
            });
            const loaded=waitEvent('Page.loadEventFired');
            const nav=await send('Page.navigate',{url});
            if(nav?.errorText) throw new Error(`navigation failed: ${nav.errorText}`);
            await loaded;
            await sleep(2500);

            const evaluated=await send('Runtime.evaluate',{
              expression:`(()=>{const d=document.documentElement,b=document.body;const text=b?.innerText||'';const allWidth=Math.max(d?.scrollWidth||0,b?.scrollWidth||0);const inHorizontalScroller=el=>{for(let p=el.parentElement;p;p=p.parentElement){const s=getComputedStyle(p);if((s.overflowX==='auto'||s.overflowX==='scroll')&&p.scrollWidth>p.clientWidth+2)return true;}return false;};const controls=[...document.querySelectorAll('button,a,input,select,textarea,[role="button"]')];const offenders=controls.map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,text:(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,80),left:r.left,right:r.right,width:r.width,inHorizontalScroller:inHorizontalScroller(el)};}).filter(x=>x.width>0&&(x.left<-2||x.right>window.innerWidth+2)&&!x.inHorizontalScroller).slice(0,20);const pvpReady=!!document.querySelector('#summary')&&!!document.querySelector('#community-board-entry-slot')&&(text.includes('Character Ranking')||text.includes('キャラクターランキング'));const boardReady=text.includes('新キャラ情報掲示板')||text.includes('New Character');return {title:document.title,href:location.href,innerWidth:window.innerWidth,innerHeight:window.innerHeight,scrollWidth:allWidth,clientWidth:d?.clientWidth||0,pvpReady,boardReady,textSample:text.slice(0,2000),offenders};})()`,
              returnByValue:true
            });
            const metrics=evaluated?.result?.value;
            if(!metrics) throw new Error('browser metrics unavailable');
            const report={url,width,height,kind,markerPresent:kind==='pvp'?metrics.pvpReady:metrics.boardReady,horizontalOverflow:metrics.scrollWidth>metrics.innerWidth+2,...metrics};
            const shot=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            writeFileSync(pngPath,Buffer.from(shot.data,'base64'));
            writeFileSync(jsonPath,JSON.stringify(report,null,2));
            console.log(JSON.stringify(report));
            if(!report.markerPresent) throw new Error(`required rendered surface missing for ${kind}; sample=${metrics.textSample}`);
            if(report.horizontalOverflow) throw new Error(`horizontal overflow: scrollWidth=${metrics.scrollWidth}, innerWidth=${metrics.innerWidth}`);
            if(metrics.offenders.length) throw new Error(`interactive elements outside viewport: ${JSON.stringify(metrics.offenders)}`);
          } finally {
            try{ws?.close();}catch{}
            try{chrome.kill('SIGTERM');}catch{}
            await sleep(250);
            try{rmSync(profile,{recursive:true,force:true});}catch{}
            if(chrome.exitCode&&chrome.exitCode!==0) console.error(stderr.slice(-4000));
          }
          NODE

          run_case() {
            local kind="$1" url="$2" width="$3" height="$4"
            local base="browser-artifacts/${kind}-${width}x${height}"
            if ! node /tmp/lr-browser-check.mjs "$url" "$width" "$height" "$kind" "$base.png" "$base.json"; then
              return 1
            fi
            test -s "$base.png"
            test -s "$base.json"
          }

          failures=0
          for viewport in "390 844" "1024 1366" "1440 1000"; do
            read -r width height <<< "$viewport"
            run_case pvp "$PVP_URL" "$width" "$height" || failures=$((failures+1))
            run_case board "$BOARD_URL" "$width" "$height" || failures=$((failures+1))
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures browser viewport case(s) failed."
            exit 1
          fi

      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: line-rangers-production-browser-${{ github.run_id }}
          path: browser-artifacts
          retention-days: 14
          if-no-files-found: error
