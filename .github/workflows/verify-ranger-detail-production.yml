name: verify-ranger-detail-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ranger-detail-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UNIT_CODE: u1556e-af
    steps:
      - name: Inspect Lerico Ranger data APIs
        run: |
          set -euo pipefail
          fetch() {
            label="$1"
            url="$2"
            out="$(mktemp)"
            code="$(curl --location --silent --show-error --output "$out" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            echo "=== $label STATUS=$code BYTES=$(wc -c < "$out") ==="
            head -c 4000 "$out" | tr '\n' ' '
            echo
          }
          fetch GET_RANGER "https://rangers.lerico.net/api/getRanger/$UNIT_CODE"
          fetch GET_SKILLS "https://rangers.lerico.net/api/getSkills"
          fetch GET_RANGERS_BASICS "https://rangers.lerico.net/api/getRangersBasics"
          fetch TRANSLATE "https://rangers.lerico.net/api/v2/translate?keys=ja%3AUNIT%2Cja%3ASKILL"
