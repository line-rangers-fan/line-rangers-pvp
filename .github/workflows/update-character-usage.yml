name: scrape-and-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-character-usage.yml"
  schedule:
    # 10分ごとに実行
    - cron: "*/10 * * * *"

# ワークフロー全体のデフォルト権限。
# GitHub Pages の作成・更新には pages:write と id-token:write が必須。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    # Playwright用Dockerイメージを使用（高速化のため）
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          playwright install chromium

      - name: Run scraper
        env:
          TARGET_PLAYER_COUNT: "200"
          MIN_REQUIRED_PLAYERS: "50"
        run: python scripts/scrape_character_usage.py

      # docs/data/character_usage.json が生成されている前提
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
