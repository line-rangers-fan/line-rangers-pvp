name: diagnose-ranger-info-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-ranger-info-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect all 1615 skill translation aliases
        run: |
          set -euo pipefail
          translations="$(mktemp)"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30             'https://rangers.lerico.net/api/v2/translate?keys=ja%3ASKILL%2Cen%3ASKILL' > "$translations"
          jq -c '{
            ja: (."ja:SKILL" | with_entries(select(.key|contains("1615")))),
            en: (."en:SKILL" | with_entries(select(.key|contains("1615"))))
          }' "$translations"
