name: diagnose-ranger-info-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-ranger-info-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect exact u1616e-brown translations
        run: |
          set -euo pipefail
          translations="$(mktemp)"
          curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30             'https://rangers.lerico.net/api/v2/translate?keys=ja%3ASKILL%2Cja%3AUNIT%2Cen%3ASKILL%2Cen%3AUNIT' > "$translations"
          jq -c '{
            jaUnit: ."ja:UNIT"."u1616e-brown_nm",
            jaSkill1Name: ."ja:SKILL"."sk1615_brown_nm",
            jaSkill1Desc: ."ja:SKILL"."sk1615_brown_desc",
            jaSkill2Name: ."ja:SKILL"."hsk1615_brown_nm",
            jaSkill2Desc: ."ja:SKILL"."hsk1615_brown_desc",
            enUnit: ."en:UNIT"."u1616e-brown_nm",
            enSkill1Name: ."en:SKILL"."sk1615_brown_nm",
            enSkill1Desc: ."en:SKILL"."sk1615_brown_desc",
            enSkill2Name: ."en:SKILL"."hsk1615_brown_nm",
            enSkill2Desc: ."en:SKILL"."hsk1615_brown_desc"
          }' "$translations"
