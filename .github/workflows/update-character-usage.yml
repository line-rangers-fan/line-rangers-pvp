name: scrape-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_collection:
        description: Collect even when the current data is still fresh
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [collect-pvp-data]
  schedule:
    # Independent hourly fallback for the Worker baseline.  A single slot and
    # a 50-minute gate avoid the old 90+ minute cadence caused by checking at
    # two slots while allowing a full 60-minute freshness window.
    - cron: "17 * * * *"

permissions:
  contents: write

# A collection must never be cancelled by a UI deployment or a later timer.
# Queue overlapping runs so the last known-good JSON always remains publishable.
concurrency:
  group: pvp-collection-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Retries and structural rechecks remain available, but an upstream outage
    # must not block the next update window.
    timeout-minutes: 20
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued dispatch retains its event SHA even after the preceding
          # run publishes new data. Start from current main so comparisons and
          # the data-only rebase include that successful publication.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run quality tests
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q
          node --check docs/assets/app.js
          node --test tests/*.mjs

      - name: Decide whether collection is due
        id: decision
        env:
          FORCE_COLLECTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_collection) || contains(github.event.head_commit.message, '[collect-now]') }}
        run: |
          set -euo pipefail
          args=(--max-age-minutes 50 --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_COLLECTION" = "true" ]; then
            args+=(--force)
          fi
          python scripts/check_data_freshness.py "${args[@]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^due=true$' "$GITHUB_OUTPUT"; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        if: steps.decision.outputs.due == 'true'
        env:
          DEBUG: "1"
          # Prefer a patient, complete collection over the old quick-fail pass.
          PLAYER_FETCH_WORKERS: "3"
          REQUEST_ATTEMPTS: "5"
          REQUEST_TIMEOUT_SECONDS: "15"
          DETAIL_FETCH_ROUNDS: "2"
          DETAIL_CONTENT_RECHECKS: "1"
        run: python scripts/scrape_character_usage.py

      - name: Cache verified character images
        if: steps.decision.outputs.due == 'true'
        # Images are optional presentation assets. Keep complete statistics
        # publishable even if the source image server is temporarily unavailable.
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/cache_character_images.py

      - name: Save collected data
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/character_usage.json docs/data/character_usage_history.json docs/data/character_usage_health.json
          while IFS= read -r -d '' image; do
            git add -- "$image"
          done < <(find docs/assets/characters -maxdepth 1 -type f -name '*.png' -print0)
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update PvP ranking data"
          # A manual site fix may land while this run is collecting. Rebase the
          # data-only commit first so the push cannot overwrite that fix.
          git pull --rebase origin main
          git push

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: .artifacts/debug/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
