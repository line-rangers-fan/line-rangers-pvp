name: public-delivery-incident-guardian

on:
  workflow_run:
    workflows:
      - deploy-github-pages
      - sync-production-pvp
      - production-visual-audit
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: public-delivery-incident-guardian
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify, self-heal, or open a delivery incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const current = context.payload.workflow_run;
            if (!current) return;

            const failureConclusions = new Set([
              "failure", "timed_out", "action_required", "startup_failure",
            ]);
            const workflowNames = {
              "deploy-github-pages": "GitHub Pages公開",
              "sync-production-pvp": "Production Worker同期",
              "production-visual-audit": "本番Visual Audit",
            };
            const label = workflowNames[current.name] || current.name;
            const incidentTitle = `自動公開の継続障害: ${label}`;

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.data.find(
              (issue) => !issue.pull_request && issue.title === incidentTitle,
            );

            if (current.conclusion === "success") {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `自動再検証で正常復旧を確認しました。\n\n確認した実行: ${current.html_url}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            if (!failureConclusions.has(current.conclusion)) return;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: current.id,
              per_page: 100,
            });
            const failedSteps = jobs.data.jobs.flatMap((job) =>
              (job.steps || [])
                .filter((step) =>
                  step.conclusion === "failure" ||
                  step.conclusion === "timed_out" ||
                  step.conclusion === "action_required"
                )
                .map((step) => step.name),
            );

            // Only this gate is automatically repaired by collecting and
            // rebuilding a fresh canonical 200/200 snapshot. Raw counts,
            // secrets, build output, and D1/R2 checks are never relaxed.
            const dataRepairSteps = new Set([
              "Validate current PvP snapshot",
            ]);

            // These operations are idempotent or verification-only. A single
            // retry handles CDN convergence, GitHub/Cloudflare/network flakes,
            // and package/source transport without hiding persistent defects.
            const transientSteps = new Set([
              "Check out current site source",
              "Check out current PvP source",
              "Check out verification script",
              "Fetch exact promoted community source",
              "Set up Node",
              "Install dependencies",
              "Resolve existing Cloudflare bindings only",
              "Upload GitHub Pages artifact",
              "Deploy GitHub Pages",
              "Verify deployed Pages serves current comparison data",
              "Deploy PvP refresh without mutating board data",
              "Verify live PvP matches canonical snapshot",
              "Wait for synchronized Pages and Worker snapshots",
              "Audit production at mobile, iPad, and desktop viewports",
              "Run production browser audit",
            ]);

            const dataRepairFailure = failedSteps.some((name) => dataRepairSteps.has(name));
            const transientFailure =
              current.name === "production-visual-audit" ||
              failedSteps.length === 0 ||
              failedSteps.some((name) => transientSteps.has(name));
            const attempt = Number(current.run_attempt || 1);

            const findRepeatedFailure = async (stepNames) => {
              const recent = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: current.workflow_id,
                branch: "main",
                status: "completed",
                per_page: 8,
              });
              const currentCreatedAt = Date.parse(current.created_at || "");
              for (const run of recent.data.workflow_runs) {
                if (run.id === current.id || !failureConclusions.has(run.conclusion)) continue;
                const previousCreatedAt = Date.parse(run.created_at || "");
                if (!Number.isFinite(currentCreatedAt) || !Number.isFinite(previousCreatedAt)) continue;
                if (currentCreatedAt < previousCreatedAt) continue;
                if (currentCreatedAt - previousCreatedAt > 2 * 60 * 60 * 1000) continue;

                const previousJobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const previousFailedSteps = previousJobs.data.jobs.flatMap((job) =>
                  (job.steps || [])
                    .filter((step) =>
                      step.conclusion === "failure" ||
                      step.conclusion === "timed_out" ||
                      step.conclusion === "action_required"
                    )
                    .map((step) => step.name),
                );

                const matches =
                  stepNames.length === 0
                    ? previousFailedSteps.length === 0
                    : stepNames.some((name) => previousFailedSteps.includes(name));
                if (matches) return { run, previousFailedSteps };
              }
              return null;
            };

            if (dataRepairFailure) {
              if (existing) {
                core.notice("A data-repair incident is already open; waiting for the next scheduled or repair collection.");
                return;
              }

              const repeated = await findRepeatedFailure(failedSteps);
              if (!repeated) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: "update-character-usage.yml",
                    ref: "main",
                    inputs: { force_collection: "true" },
                  });
                  core.warning(
                    "A publish-time comparison validation failure triggered one bounded fresh 200/200 collection. No incident is opened unless the same failure repeats on an independent publication.",
                  );
                } catch (error) {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: incidentTitle,
                    body: [
                      `${label} の比較データ検証で停止し、自動修復の起動にも失敗しました。`,
                      "",
                      `実行: ${current.html_url}`,
                      `失敗ステップ: ${failedSteps.join(", ") || "不明"}`,
                      `自動修復起動エラー: ${error.message}`,
                      "",
                      "200/200、比較整合性、秘密情報検査、D1/R2保護条件は緩めません。",
                    ].join("\n"),
                  });
                  throw error;
                }
                return;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: incidentTitle,
                body: [
                  `${label} の比較データ検証が独立した公開実行でも連続して失敗しました。`,
                  "",
                  `今回: ${current.html_url}`,
                  `前回: ${repeated.run.html_url}`,
                  `今回の失敗ステップ: ${failedSteps.join(", ") || "不明"}`,
                  `前回の失敗ステップ: ${repeated.previousFailedSteps.join(", ") || "不明"}`,
                  "",
                  "auto-repair-kind:data",
                  "初回失敗時の強制200/200再収集でも解消しなかったため、ここで重大Incidentとして停止します。",
                  "生の順位・装備数、200/200条件、秘密情報、D1/R2保護条件は緩めません。",
                ].join("\n"),
              });
              return;
            }

            if (transientFailure && attempt === 1) {
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: current.id,
              });
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `一時的な公開/通信失敗を検出したため、この実行を1回だけ再試行しました。\n\n実行: ${current.html_url}\n失敗ステップ: ${failedSteps.join(", ") || "起動段階"}`,
                });
              }
              core.notice(`${label} had a retryable delivery failure; one automatic retry was requested.`);
              return;
            }

            if (transientFailure) {
              const repeated = await findRepeatedFailure(failedSteps);
              if (!repeated) {
                core.warning(
                  "Delivery failure persisted after the bounded retry, but no matching independent failure was found in the previous two hours. Keeping the last known-good publication and waiting for the next normal publication before escalating.",
                );
                return;
              }
              core.notice(
                `Repeated delivery failure confirmed across independent runs. Current: ${failedSteps.join(", ") || "起動段階"}; previous: ${repeated.previousFailedSteps.join(", ") || "起動段階"}`,
              );
            }

            if (existing) return;

            const hardFailure = !transientFailure;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: incidentTitle,
              body: [
                hardFailure
                  ? `${label} の安全・構成・ビルド品質ゲートで停止しました。`
                  : `${label} が1回の自動再試行後も完了できませんでした。`,
                "",
                `実行: ${current.html_url}`,
                `run attempt: ${attempt}`,
                `失敗ステップ: ${failedSteps.join(", ") || "不明"}`,
                "",
                hardFailure
                  ? "この種類は自動で品質条件を緩めません。前回の正常公開を維持します。"
                  : "一時的な公開反映・ネットワーク障害として1回再試行しましたが、前回の正常公開を維持します。",
                "200/200、比較整合性、秘密情報検査、D1/R2保護条件は常に必須です。",
                "次の正常実行を確認すると、このIssueは自動的に閉じます。",
              ].join("\n"),
            });
