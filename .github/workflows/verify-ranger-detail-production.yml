name: verify-ranger-detail-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ranger-detail-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_BASE: https://line-rangers-pvp-community-production.n-yu1791.workers.dev
      PAGES_BASE: https://line-rangers-fan.github.io/line-rangers-pvp
      UNIT_CODE: u1556e-af
    steps:
      - name: Verify live Ranger detail API and modal assets
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status=0
          for attempt in $(seq 1 8); do
            status="$(curl --location --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}'               --connect-timeout 10 --max-time 45 -H 'Origin: https://line-rangers-fan.github.io'               "$WORKER_BASE/api/ranger-info?unit=$UNIT_CODE" || true)"
            [ "$status" = "200" ] && break
            sleep 3
          done
          echo "LIVE_RANGER_HTTP=$status"
          test "$status" = "200"
          jq -e --arg unit "$UNIT_CODE" '
            .unitCode == $unit and
            .name == "9★ 超能力者 アーニャ" and
            .sourceUrl == ("https://rangers.lerico.net/ja/ranger/" + $unit) and
            (.skills | length == 2) and
            .skills[0].name == "わくわくっ！" and
            (.skills[0].description | contains("味方のスキル範囲30%アップ")) and
            (.skills[1].name | startswith("星を摑む光の矢!")) and
            (.skills[1].description | contains("敵の無敵スキル解除"))
          ' "$body" >/dev/null
          grep -qi '^access-control-allow-origin: https://line-rangers-fan.github.io' "$headers"
          echo "LIVE_RANGER_NAME=$(jq -r '.name' "$body")"
          echo "LIVE_RANGER_SKILLS=$(jq -r '[.skills[].name] | join(" / ")' "$body")"

          pages_js="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$PAGES_BASE/assets/app.js")"
          worker_js="$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$WORKER_BASE/pvp/assets/app.js")"
          for js in "$pages_js" "$worker_js"; do
            grep -q 'equipment-character-name' <<< "$js"
            grep -q 'equipment-skill-list' <<< "$js"
            grep -q 'const displayName = info?.name || characterLabel(character);' <<< "$js"
            grep -q 'rangers.lerico.net/ja/ranger/' <<< "$js"
          done
          echo "LIVE_RANGER_MODAL=ok"
