name: scrape-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_collection:
        description: Collect even when the current data is still fresh
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [collect-pvp-data]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pvp-collection-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 32

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run collector-critical quality tests
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_scrape_character_usage.py \
            tests/test_quality_checks.py \
            tests/test_check_data_freshness.py \
            tests/test_collection_resilience.py \
            tests/test_queued_collection_checkout.py \
            tests/test_comparison_guards.py \
            tests/test_cross_sample_comparisons.py

      - name: Run scheduled collector preflight
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrape_character_usage.py \
            scripts/quality_checks.py \
            scripts/check_data_freshness.py \
            scripts/rebuild_cross_sample_comparisons.py \
            scripts/validate_public_comparisons.py \
            scripts/validate_public_bundle.py
          PYTHONPATH=. python - <<'PY'
          from scripts import scrape_character_usage as scraper
          assert scraper.TARGET_PLAYER_COUNT == 200
          assert scraper.RANK_COMPARISON_PERIODS["hour"] == 60 * 60
          assert scraper.RANK_COMPARISON_PERIODS["day"] == 24 * 60 * 60
          assert scraper.CALENDAR_CLOSE_START_HOUR == 22
          assert scraper.CALENDAR_CLOSE_END_HOUR == 23
          PY

      - name: Decide whether collection is due
        id: decision
        env:
          FORCE_COLLECTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_collection) || contains(github.event.head_commit.message, '[collect-now]') }}
        run: |
          set -euo pipefail
          args=(--max-age-minutes 40 --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_COLLECTION" = "true" ]; then
            args+=(--force)
          fi
          python scripts/check_data_freshness.py "${args[@]}"
          if grep -q '^due=true$' "$GITHUB_OUTPUT"; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply resilient partial collection policy
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          python scripts/prepare_partial_collection_runtime.py
          python -m py_compile scripts/scrape_character_usage.py scripts/quality_checks.py scripts/prepare_partial_collection_runtime.py

      - name: Run scraper
        if: steps.decision.outputs.due == 'true'
        env:
          DEBUG: "1"
          PLAYER_FETCH_WORKERS: "4"
          REQUEST_ATTEMPTS: "3"
          REQUEST_TIMEOUT_SECONDS: "10"
          DETAIL_FETCH_ROUNDS: "1"
          DETAIL_CONTENT_RECHECKS: "0"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Collection attempt ${attempt}/3"
            if python scripts/scrape_character_usage.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Collection attempt ${attempt} incomplete/failed; retrying after 10s."
              sleep 10
            fi
          done
          echo "All collection attempts failed; preserving last known-good snapshot."
          exit 1

      - name: Cache verified character images
        if: steps.decision.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/cache_character_images.py

      - name: Rebuild verified comparisons
        if: steps.decision.outputs.due == 'true'
        run: python scripts/rebuild_cross_sample_comparisons.py

      - name: Validate publishable snapshot after repair
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          jq -e '(
            (.target_players == 200 and .sampled_players == 200 and .complete_target == true and .publication_mode == "complete") or
            (.target_players == 200 and .sampled_players > 0 and .sampled_players < 200 and .complete_target == false and .publication_mode == "partial_after_stale" and (.partial_fallback | type) == "object")
          )' docs/data/character_usage.json >/dev/null
          python scripts/validate_public_comparisons.py docs/data/character_usage.json
          python scripts/validate_public_bundle.py

      - name: Synchronize git base before saving collection
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          git fetch --prune origin main
          stash_created=false
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked --message "collector-generated-data-before-rebase"
            stash_created=true
          fi
          git rebase origin/main
          if [ "$stash_created" = "true" ]; then
            git stash pop
          fi

      - name: Rebuild and revalidate after synchronization
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          python scripts/rebuild_cross_sample_comparisons.py
          jq -e '(
            (.target_players == 200 and .sampled_players == 200 and .complete_target == true and .publication_mode == "complete") or
            (.target_players == 200 and .sampled_players > 0 and .sampled_players < 200 and .complete_target == false and .publication_mode == "partial_after_stale" and (.partial_fallback | type) == "object")
          )' docs/data/character_usage.json >/dev/null
          python scripts/validate_public_comparisons.py docs/data/character_usage.json
          python scripts/validate_public_bundle.py

      - name: Restore runner-local policy source
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          git restore -- scripts/scrape_character_usage.py scripts/quality_checks.py

      - name: Save collected data
        if: steps.decision.outputs.due == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data docs/assets/characters
          if git diff --cached --quiet; then
            echo "No collector data changes to publish."
            exit 0
          fi
          git commit -m "Update PvP ranking data"

          for push_attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$push_attempt" -lt 3 ]; then
              echo "Push attempt ${push_attempt} rejected; rebasing clean committed snapshot onto latest main."
              git pull --rebase origin main
              python scripts/prepare_partial_collection_runtime.py
              python scripts/rebuild_cross_sample_comparisons.py
              jq -e '(
                (.target_players == 200 and .sampled_players == 200 and .complete_target == true and .publication_mode == "complete") or
                (.target_players == 200 and .sampled_players > 0 and .sampled_players < 200 and .complete_target == false and .publication_mode == "partial_after_stale" and (.partial_fallback | type) == "object")
              )' docs/data/character_usage.json >/dev/null
              python scripts/validate_public_comparisons.py docs/data/character_usage.json
              python scripts/validate_public_bundle.py
              git restore -- scripts/scrape_character_usage.py scripts/quality_checks.py
              git add -A docs/data docs/assets/characters
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
            fi
          done
          echo "Unable to publish the collected snapshot after 3 push attempts."
          exit 1

      - name: Dispatch synchronized PvP publication
        if: steps.decision.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-github-pages.yml/dispatches" -f ref=main >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-production-pvp.yml/dispatches" -f ref=main >/dev/null

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: .artifacts/debug/
          if-no-files-found: ignore

# [collect-now] Manual collection trigger marker.
