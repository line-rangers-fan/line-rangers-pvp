name: scrape-and-deploy

on:
  workflow_dispatch:
  schedule:
    # 毎日 UTC 18:00 (JST 3:00) に実行。頻度は用途に合わせて調整してください。
    - cron: "0 18 * * *"

# ワークフロー全体のデフォルト権限。
# GitHub Pages の作成・更新には pages:write と id-token:write が必須。
# これが無い(または contents:read のみ)と
# "Resource not accessible by integration" で失敗する。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    # 公式のPlaywright用Dockerイメージを使うと、Chromium本体と
    # apt依存ライブラリが最初から入っているため、
    # 毎回の "playwright install --with-deps" が丸ごと不要になり大幅に高速化する。
    # イメージのバージョンタグは、下の requirements.txt (playwright==1.57.0) と
    # 必ず一致させること。ズレるとブラウザ実行ファイルが見つからずエラーになる。
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          # ブラウザ本体・システム依存は既にイメージに含まれているため
          # apt install は不要。Playwright側の内部レジストリだけ更新する。
          playwright install chromium

      - name: Run scraper
        env:
          TARGET_PLAYER_COUNT: "200"
          MIN_REQUIRED_PLAYERS: "50"
        run: python scripts/scrape_character_usage.py

      # docs/data/character_usage.json が生成されている前提。
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
