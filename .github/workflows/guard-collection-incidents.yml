name: collection-incident-guardian

on:
  workflow_run:
    workflows: ["scrape-and-deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: collection-incident-guardian
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or resolve the collection incident
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const incidentTitle = "自動集計の連続障害を検出しました";
            const failureConclusions = new Set([
              "failure", "timed_out", "cancelled", "action_required", "startup_failure",
            ]);

            let current = context.payload.workflow_run;
            if (!current) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "update-character-usage.yml",
                branch: "main",
                status: "completed",
                per_page: 10,
              });
              current = response.data.workflow_runs[0];
            }
            if (!current) {
              core.notice("No completed collection workflow was found.");
              return;
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.data.find(
              (issue) => !issue.pull_request && issue.title === incidentTitle,
            );

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: current.id,
              per_page: 100,
            });
            const scraperSucceeded = jobs.data.jobs.some((job) =>
              (job.steps || []).some(
                (step) => step.name === "Run scraper" && step.conclusion === "success",
              ),
            );
            if (current.conclusion === "success") {
              if (existing && scraperSucceeded) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `正常な200人集計を確認したため、自動的に復旧済みとします。\n\n確認した実行: ${current.html_url}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            if (!failureConclusions.has(current.conclusion) || existing) return;

            const recent = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-character-usage.yml",
              branch: "main",
              status: "completed",
              per_page: 10,
            });
            const previous = recent.data.workflow_runs.find(
              (run) => run.id !== current.id,
            );
            if (!previous || !failureConclusions.has(previous.conclusion)) {
              core.notice("A single failure will be handled by the automatic repair paths.");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: incidentTitle,
              body: [
                "主集計が2回連続で完了できませんでした。前回の正常データは維持されています。",
                "",
                `直近の実行: ${current.html_url}`,
                `その前の実行: ${previous.html_url}`,
                "",
                "まずOPERATIONS.mdの「更新が遅れた場合」を確認してください。品質基準を外したり、公開JSONを直接編集したりしないでください。",
                "正常な200人集計が成功すると、このIssueは自動的に閉じられます。",
              ].join("\n"),
            });
