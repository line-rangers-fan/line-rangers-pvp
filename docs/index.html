<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LINEレンジャーのレジェンド帯キャラクター編成数と採用率を集計する非公式サイト"
  >

  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' https: data:;
      media-src 'self';
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'none';
    "
  >

  <title>LINEレンジャー レジェンド帯キャラ集計</title>

  <link
    rel="stylesheet"
    href="./assets/style.css?v=20260828-3"
  >

  <script
    src="./assets/app.js?v=20260828-3"
    defer
  ></script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">

      <div class="language-switcher">
        <button type="button" data-language="ja">🇯🇵 日本語</button>
        <button type="button" data-language="en">🇺🇸 English</button>
        <button type="button" data-language="zh">🇹🇼 繁體中文</button>
        <button type="button" data-language="th">🇹🇭 ไทย</button>
        <button type="button" data-language="id">🇮🇩 Indonesia</button>
        <button type="button" data-language="vi">🇻🇳 Tiếng Việt</button>
        <button type="button" data-language="ko">🇰🇷 한국어</button>
      </div>

      <p class="eyebrow">
        UNOFFICIAL STATISTICS
      </p>

      <h1 id="page-title">
        レジェンド帯 キャラ集計
      </h1>

      <p
        id="page-description"
        class="header-description"
      >
        レジェンド帯プレイヤーの防衛チームから、
        キャラクターの編成数と採用率を集計しています。
      </p>

      <p id="ranking-tap-hint" class="ranking-tap-hint">
        キャラクターをタップすると、装備ランキングが見れます。
      </p>

      <p id="sunday-notice" class="weekly-notice" hidden></p>

    </div>
  </header>

  <main class="main-content">

    <noscript>
      <p class="message message-error" id="noscript-message">
        表示するにはJavaScriptを有効にしてください。
      </p>
    </noscript>

    <section
      id="status-message"
      class="message"
      aria-live="polite"
    >
      集計データを読み込んでいます。
    </section>

    <section
      id="summary"
      class="summary-grid"
      aria-label="集計概要"
      hidden
    >
      <article class="summary-card">
        <span
          class="summary-label"
          id="label-league"
        >
          リーグ
        </span>

        <strong id="summary-league">
          -
        </strong>
      </article>

      <article class="summary-card">
        <span
          class="summary-label"
          id="label-players"
        >
          集計人数
        </span>

        <strong id="summary-players">
          -
        </strong>
      </article>

      <article class="summary-card">
        <span
          class="summary-label"
          id="label-slots"
        >
          全編成キャラ数
        </span>

        <strong id="summary-slots">
          -
        </strong>
      </article>

      <article class="summary-card">
        <span
          class="summary-label"
          id="label-characters"
        >
          キャラ種類数
        </span>

        <strong id="summary-characters">
          -
        </strong>
      </article>

      <article class="summary-card summary-updated-card">
        <span
          class="summary-label"
          id="label-updated"
        >
          最終更新
        </span>

        <strong id="summary-updated">
          -
        </strong>

        <div class="summary-update-meta" aria-live="polite">
          <span id="summary-freshness" class="freshness-badge">
            -
          </span>

          <span id="summary-health">
            -
          </span>
        </div>
      </article>
    </section>

    <section
      id="ranking-section"
      class="ranking-section"
      hidden
    >
      <div class="table-heading">
        <div>
          <h2 id="ranking-title">
            キャラクターランキング
          </h2>

          <p id="ranking-description">
            編成数が多い順に表示しています。
          </p>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <caption
            class="visually-hidden"
            id="ranking-caption"
          >
            レジェンド帯キャラクター集計ランキング
          </caption>

          <thead>
            <tr>
              <th
                scope="col"
                id="th-rank"
              >
                順位
              </th>

              <th
                scope="col"
                id="th-character"
              >
                キャラクター
              </th>

              <th
                scope="col"
                id="th-occurrence"
              >
                編成数
              </th>

              <th
                scope="col"
                id="th-players"
              >
                採用人数
              </th>

              <th
                scope="col"
                id="th-rate"
              >
                採用率
              </th>
            </tr>
          </thead>

          <tbody id="ranking-body"></tbody>
        </table>
      </div>

      <p
        id="result-count"
        class="result-count"
      ></p>
    </section>

    <dialog id="equipment-dialog" class="equipment-dialog">
      <button type="button" id="equipment-close" class="equipment-close" aria-label="Close">×</button>
