name: ranking-freshness-watchdog

on:
  workflow_dispatch:
  schedule:
    # This independent workflow checks between the collector's two slots.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: pvp-freshness-watchdog
  cancel-in-progress: false

jobs:
  repair-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check published data age
        id: freshness
        run: |
          python scripts/check_data_freshness.py \
            --max-age-minutes 55 \
            --github-output "$GITHUB_OUTPUT"

      - name: Trigger a repair collection
        if: steps.freshness.outputs.due == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-character-usage.yml",
              ref: "main",
              inputs: { force_collection: "true" },
            });
