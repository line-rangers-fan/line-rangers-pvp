name: deploy-private-repo-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "infra/cloudflare-owner-preview/**"
      - "tests/owner_preview_worker.test.mjs"
      - "tests/test_community_entry_contract.py"
      - ".github/workflows/deploy-owner-preview.yml"

permissions:
  contents: read

concurrency:
  group: private-repo-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate preview and integration contracts
        run: |
          set -euo pipefail
          node --check infra/cloudflare-owner-preview/src/index.js
          node tests/owner_preview_worker.test.mjs
          python -m pytest -q tests/test_community_entry_contract.py
          grep -q 'x-robots-tag' infra/cloudflare-owner-preview/src/index.js
          grep -q 'run_worker_first = true' infra/cloudflare-owner-preview/wrangler.toml
          grep -q 'binding = "ASSETS"' infra/cloudflare-owner-preview/wrangler.toml
          if grep -Eq 'OWNER_TOKEN|COOKIE_NAME|owner/login' infra/cloudflare-owner-preview/src/index.js; then
            echo "Preview must remain no-login."
            exit 1
          fi
          if grep -q 'raw.githubusercontent.com' infra/cloudflare-owner-preview/src/index.js; then
            echo "Preview must use bundled private-repository assets."
            exit 1
          fi

      - name: Resolve Cloudflare account ID
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          if ! [[ "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy no-login repo-backed preview Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          workingDirectory: infra/cloudflare-owner-preview
          wranglerVersion: "4.131.2"
          command: deploy

      - name: Verify no-login preview and direct ranking layout
        run: |
          set -euo pipefail
          base="https://line-rangers-pvp-owner-preview.n-yu1791.workers.dev"
          root="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$base/")"
          printf '%s' "$root" | grep -q 'レジェンド帯 キャラ集計'
          printf '%s' "$root" | grep -q 'id="community-board-entry-slot"'
          printf '%s' "$root" | grep -q 'id="ranking-section"'
          if printf '%s' "$root" | grep -q '現在、サイトを改修しています。'; then
            echo "No-login preview unexpectedly returned maintenance mode."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$base/assets/community-entry.js" | grep -q '新キャラ情報掲示板'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$base/assets/app.js" | grep -q 'character_usage.json'
