name: verify-ranger-detail-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ranger-detail-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_BASE: https://line-rangers-pvp-community-production.n-yu1791.workers.dev
      UNIT_CODE: u1556e-af
    steps:
      - name: Inspect live Ranger source
        run: |
          set -euo pipefail
          worker_body="$(mktemp)"
          worker_status="$(curl --location --silent --show-error --output "$worker_body" --write-out '%{http_code}'             --connect-timeout 10 --max-time 30 -H 'Origin: https://line-rangers-fan.github.io'             "$WORKER_BASE/api/ranger-info?unit=$UNIT_CODE" || true)"
          echo "WORKER_STATUS=$worker_status"
          echo "WORKER_BODY=$(head -c 500 "$worker_body" | tr '\n' ' ')"

          upstream="$(mktemp)"
          upstream_status="$(curl --location --silent --show-error --output "$upstream" --write-out '%{http_code}'             --connect-timeout 10 --max-time 30             -H 'Accept: text/html,application/xhtml+xml'             -H 'User-Agent: line-rangers-pvp-character-detail/1.0'             "https://rangers.lerico.net/ja/ranger/$UNIT_CODE" || true)"
          echo "UPSTREAM_STATUS=$upstream_status"
          echo "UPSTREAM_BYTES=$(wc -c < "$upstream")"
          echo "=== JS REFERENCES ==="
          grep -oE '[A-Za-z0-9_./?&=%{}:-]+\.js[A-Za-z0-9_./?&=%{}:-]*' "$upstream" | sort -u | head -80 || true
          echo "=== SRC/HREF/NG-INCLUDE ==="
          grep -oE '(src|href|ng-include)="[^"]+"' "$upstream" | head -120 || true
          echo "=== API/RANGER/SKILL SOURCE LINES ==="
          grep -inE 'api|get-current-res|angular|ranger|skill|unit' "$upstream" | head -120 || true
