name: deploy-owner-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare-owner-preview/**"
      - "tests/owner_preview_worker.test.mjs"
      - ".github/workflows/deploy-owner-preview.yml"

permissions:
  contents: read

concurrency:
  group: owner-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Worker source
        run: |
          set -euo pipefail
          node --check infra/cloudflare-owner-preview/src/index.js
          node tests/owner_preview_worker.test.mjs
          grep -q 'HttpOnly; Secure; SameSite=Strict' infra/cloudflare-owner-preview/src/index.js
          grep -q 'x-robots-tag' infra/cloudflare-owner-preview/src/index.js
          grep -Eq 'OWNER_TOKEN_SHA256 = "[a-f0-9]{64}"' infra/cloudflare-owner-preview/src/index.js
          if grep -Eq 'OWNER_TOKEN[[:space:]]*=' infra/cloudflare-owner-preview/src/index.js; then
            echo "Plaintext owner access key must never be committed."
            exit 1
          fi

      - name: Resolve Cloudflare account ID
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          if ! [[ "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Cloudflare returned an invalid account ID."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy owner-only preview Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          workingDirectory: infra/cloudflare-owner-preview
          command: deploy

      - name: Verify public maintenance gate and owner login
        run: |
          set -euo pipefail
          base="https://line-rangers-pvp-owner-preview.n-yu1791.workers.dev"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$base/" | grep -q '現在、サイトを改修しています。'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 "$base/owner" | grep -q 'Owner Preview'
