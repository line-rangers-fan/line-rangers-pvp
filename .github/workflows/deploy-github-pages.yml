name: deploy-github-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".production-promotion-trigger"
      - ".github/workflows/deploy-github-pages.yml"

permissions:
  contents: read

concurrency:
  group: line-rangers-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      data_sha256: ${{ steps.snapshot.outputs.data_sha256 }}
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
    steps:
      - name: Check out current site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued Pages run must deploy the newest canonical comparison
          # snapshot, never the older push SHA that originally queued it.
          # Full history is required to verify the ephemeral same-sized
          # 30-90 minute baseline used only by the one-hour character delta.
          ref: main
          fetch-depth: 0

      - name: Validate public static safety
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/assets/community-entry.js
          test -s docs/assets/community-entry.css
          grep -q 'id="community-board-entry-slot"' docs/index.html
          community_entry_version="$(git hash-object docs/assets/community-entry.js | cut -c1-12)"
          community_entry_css_version="$(git hash-object docs/assets/community-entry.css | cut -c1-12)"
          test -n "$community_entry_version"
          test -n "$community_entry_css_version"
          grep -q "community-entry.js?v=$community_entry_version" docs/index.html
          grep -q "community-entry.css?v=$community_entry_css_version" docs/index.html
          grep -q 'defaultState: true' docs/assets/community-entry.js
          grep -q 'state: true' docs/assets/community-entry.js
          grep -q 'allowedPath: "/line-rangers-pvp/boards/"' docs/assets/community-entry.js
          grep -q 'api/activity?public=1' docs/assets/community-entry.js
          grep -q 'レジェンド帯 キャラ集計' docs/index.html
          if grep -RInE --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' \
              'BOARD_OWNER_ACCESS_TOKEN|BOARD_OWNER_SUBJECT|BOARD_ANON_COOKIE_SECRET|CLOUDFLARE_.*TOKEN' docs; then
            echo "A secret-like value was found in the Pages artifact source."
            exit 1
          fi

      - name: Apply stale-partial validation policy
        run: |
          set -euo pipefail
          # Keep the Pages gate identical to the collector's authorized
          # partial_after_stale validation. The compatibility patch is
          # versioned in the repository and changes only the runner copy.
          python scripts/prepare_partial_collection_runtime.py
          python -m py_compile scripts/quality_checks.py scripts/prepare_partial_collection_runtime.py

      - name: Validate current PvP snapshot
        run: |
          set -euo pipefail
          # Both normal 200/200 snapshots and the already-authorized
          # partial_after_stale fallback are valid public ranking inputs.
          # validate_public_bundle.py performs the full fail-closed validation
          # of the fallback marker, health JSON, histories, and comparisons.
          jq -e '
            .target_players == 200 and
            (
              (.sampled_players == 200 and .complete_target == true and
                (.publication_mode == "complete" or .publication_mode == null)) or
              (.sampled_players > 0 and .sampled_players < 200 and
                .complete_target == false and
                .publication_mode == "partial_after_stale" and
                (.partial_fallback | type) == "object")
            )
          ' docs/data/character_usage.json >/dev/null
          python scripts/validate_public_comparisons.py docs/data/character_usage.json
          python scripts/validate_public_bundle.py

      - name: Fetch pinned community frontend
        run: |
          set -euo pipefail
          source_sha="$(sed -n 's/^copy_source_sha=//p' .production-promotion-trigger | head -n1)"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          git clone --filter=blob:none --no-checkout --no-tags https://github.com/nyu1791-collab/copy-LINE-.git board-source
          git -C board-source fetch --depth=1 origin "$source_sha"
          git -C board-source checkout --detach "$source_sha"
          test "$(git -C board-source rev-parse HEAD)" = "$source_sha"
          test -s board-source/vite.pages.config.mjs

      - name: Set up Node for the Pages board
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Build and verify the pinned Pages board
        working-directory: board-source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/pages-api.test.mjs tests/community-multi-character.test.mjs tests/community-release-policy.test.mjs
          npx vite build --config vite.pages.config.mjs
          node scripts/validate-pages-board.mjs dist-pages/boards

      - name: Prepare cache-busted Pages artifact
        run: |
          set -euo pipefail
          rm -rf pages-dist
          cp -a docs pages-dist
          cp -a board-source/dist-pages/boards pages-dist/boards
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pages-dist/index.html")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["GITHUB_SHA"]
          assets = ("app.js", "community-entry.js", "style.css", "community-entry.css")
          for asset in assets:
              pattern = rf'(\./assets/{re.escape(asset)})\?v=[^"\']+'
              text, count = re.subn(pattern, rf'\1?v={sha}', text)
              if count != 1:
                  raise SystemExit(f"Expected exactly one cache-busted reference for {asset}, got {count}")
          path.write_text(text, encoding="utf-8")
          PY
          grep -q "app.js?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "community-entry.js?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "style.css?v=$GITHUB_SHA" pages-dist/index.html
          grep -q "community-entry.css?v=$GITHUB_SHA" pages-dist/index.html

      - name: Record deployed comparison snapshot
        id: snapshot
        run: |
          set -euo pipefail
          hash="$(sha256sum pages-dist/data/character_usage.json | awk '{print $1}')"
          source_sha="$(git rev-parse HEAD)"
          if ! [[ "$hash" =~ ^[a-f0-9]{64}$ ]] || ! [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid Pages source identity."
            exit 1
          fi
          echo "data_sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify signed board API before publishing Pages
        run: |
          set -euo pipefail
          # The promotion and Pages runs start together. Keep the old Pages
          # artifact until the pinned Worker supports the new signed transport.
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              --header 'Origin: https://line-rangers-fan.github.io' \
              --dump-header "$RUNNER_TEMP/pages-api-headers" \
              'https://line-rangers-pvp-community-production.n-yu1791.workers.dev/api/session' \
              --output "$RUNNER_TEMP/pages-api-session.json" \
              && grep -iq '^access-control-allow-origin: https://line-rangers-fan.github.io' "$RUNNER_TEMP/pages-api-headers" \
              && jq -e '.viewerToken | type == "string" and test("^v1[.][a-f0-9-]{36}[.][0-9]{10,}[.][A-Za-z0-9_-]{43}$")' "$RUNNER_TEMP/pages-api-session.json" >/dev/null; then
              rm -f "$RUNNER_TEMP/pages-api-session.json"
              echo "Production signed Pages API is ready."
              exit 0
            fi
            rm -f "$RUNNER_TEMP/pages-api-session.json"
            sleep 15
          done
          echo "Production signed Pages API is not ready; preserving the previous Pages artifact." >&2
          exit 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Verify deployed Pages serves current comparison data
        env:
          SITE_URL: https://line-rangers-fan.github.io/line-rangers-pvp
          EXPECTED_DATA_SHA256: ${{ needs.build.outputs.data_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          canonical_sha="$(git rev-parse HEAD)"
          canonical_data_sha="$(sha256sum docs/data/character_usage.json | awk '{print $1}')"
          if [ "$canonical_sha" != "$EXPECTED_SOURCE_SHA" ] && [ "$canonical_data_sha" != "$EXPECTED_DATA_SHA256" ]; then
            echo "Pages verification superseded by newer canonical PvP data; allowing the newer queued deployment to continue."
            exit 0
          fi
          success=false
          for attempt in $(seq 1 18); do
            nonce="$GITHUB_SHA-$attempt"
            if curl -fsSL --retry 2 --retry-delay 1 "$SITE_URL/?deploy=$nonce" -o /tmp/index.html \
              && curl -fsSL --retry 2 --retry-delay 1 "$SITE_URL/data/character_usage.json?deploy=$nonce" -o /tmp/data.json \
              && grep -q 'data-language="ja"' /tmp/index.html \
              && grep -q 'data-language="en"' /tmp/index.html \
              && grep -q 'data-language="zh"' /tmp/index.html \
              && grep -q 'data-language="th"' /tmp/index.html \
              && [ "$(sha256sum /tmp/data.json | awk '{print $1}')" = "$EXPECTED_DATA_SHA256" ] \
              && python scripts/validate_public_comparisons.py /tmp/data.json >/dev/null; then
              success=true
              break
            fi
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "Published Pages did not converge to the validated comparison build."
            exit 1
          fi
          echo "Published Pages comparison data is current and complete."
