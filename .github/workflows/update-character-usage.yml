name: scrape-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_collection:
        description: Collect even when the current data is still fresh
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [collect-pvp-data]
  schedule:
    # Two off-peak opportunities make a dropped cron event recoverable. The
    # freshness gate still limits successful collection to about once an hour.
    - cron: "17,47 * * * *"

permissions:
  contents: write

# A collection must never be cancelled by a UI deployment or a later timer.
# Queue overlapping runs so the last known-good JSON always remains publishable.
concurrency:
  group: pvp-collection-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run quality tests
        run: |
          PYTHONPATH=. pytest -q
          node --check docs/assets/app.js
          node --test tests/test_cloudflare_watchdog.mjs

      - name: Decide whether collection is due
        id: decision
        env:
          FORCE_COLLECTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_collection) || contains(github.event.head_commit.message, '[collect-now]') }}
        run: |
          args=(--max-age-minutes 50 --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_COLLECTION" = "true" ]; then
            args+=(--force)
          fi
          python scripts/check_data_freshness.py "${args[@]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^due=true$' "$GITHUB_OUTPUT"; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        if: steps.decision.outputs.due == 'true'
        env:
          DEBUG: "1"
        run: python scripts/scrape_character_usage.py

      - name: Save collected data
        if: steps.decision.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/character_usage.json docs/data/character_usage_history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update PvP ranking data"
          git push

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: .artifacts/debug/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
